const JournalPrompts = ({ isTeacher }) => {
  const [entries, setEntries] = useLS('journal', []);
  const [content, setContent] = useState('');
  const [aiLog, setAiLog] = useState('');
  const [mood, setMood] = useState(null);
  const [view, setView] = useState('write');
  const [expandedId, setExpandedId] = useState(null);
  const [savedFlash, setSavedFlash] = useState(false);
  const [shareWithTeacher, setShareWithTeacher] = useState(false);
  const [crisisDismissed, setCrisisDismissed] = useState(false);

  const MIN_SENTENCES = 3;
  const PROMPT = "What is one thing you learned about your learning this week?";
  const suggestedMood = content.length > 50 ? detectMood(content) : null;

  const countSentences = (text) => text.split(/[.!?]+/).filter(s => s.trim().length > 4).length;
  const sentCount = countSentences(content);
  const canSave = sentCount >= MIN_SENTENCES && content.trim().length > 0;

  const save = () => {
    if (!canSave) return;
    const finalMood = mood || suggestedMood || 3;
    const entry = {
      id: Date.now(),
      date: new Date().toISOString(),
      displayDate: new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
      prompt: PROMPT,
      content: content.trim(),
      aiLog: aiLog.trim(),
      sentences: sentCount,
      mood: finalMood,
      moodSource: mood ? 'student' : 'detected',
      shared: shareWithTeacher,
      grade: null,
      gradeNote: ''
    };
    const updatedEntries = [entry, ...entries];
    setEntries(updatedEntries);
    setContent(''); setAiLog(''); setMood(null); setShareWithTeacher(false);
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 2500);
    // Sync to Firebase
    if (FB_ENABLED) {
      const code = getClassCode();
      const sid = getStudentId();
      if (code && code !== 'SOLO') {
        const allMoods = updatedEntries.filter(e => e.mood != null).map(e => ({date: e.date, mood: e.mood, note: e.aiLog || ''}));
        const allJournal = updatedEntries.filter(e => e.shared).map(e => ({date: e.date, text: e.content || e.text || '', mood: e.mood, shared: e.shared || false}));
        fbWrite(`sv_classrooms/${code}/students/${sid}/moods`, allMoods);
        fbWrite(`sv_classrooms/${code}/students/${sid}/journal`, allJournal);
        fbPatch(`sv_classrooms/${code}/students/${sid}/profile`, {lastActive: new Date().toISOString()});
      }
    }
  };

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const downloadEntry = (e) => {
    const m = e.mood ? getMood(e.mood) : null;
    const text = [
      'Journal Entry',
      e.displayDate || e.date,
      ...(m ? ['Mood: ' + m.emoji + ' ' + m.label + (e.moodSource === 'detected' ? ' (Smart Detection)' : '')] : []),
      '',
      'Prompt: ' + e.prompt,
      '',
      e.content || e.text,
      ...(e.aiLog ? ['', 'AI Interaction Log:', e.aiLog] : []),
      ...(e.grade ? ['', 'Grade: ' + e.grade, ...(e.gradeNote ? ['Note: ' + e.gradeNote] : [])] : [])
    ].join('\n');
    downloadBlob(new Blob([text], { type: 'text/plain' }), `journal_${(e.date||'').slice(0,10)}.txt`);
  };

  const downloadAll = (fmt) => {
    if (!entries.length) return;
    if (fmt === 'txt') {
      const text = entries.map(e => [
        '═'.repeat(40),
        e.displayDate || e.date,
        'Prompt: ' + e.prompt,
        '',
        e.content || e.text,
        ...(e.aiLog ? ['', 'AI Log:', e.aiLog] : []),
        ...(e.grade ? ['', 'Grade: ' + e.grade + (e.gradeNote ? ' | ' + e.gradeNote : '')] : [])
      ].join('\n')).join('\n\n');
      downloadBlob(new Blob([text], { type: 'text/plain' }), 'all_journal_entries.txt');
    } else if (fmt === 'csv') {
      const esc = (v) => '"' + String(v || '').replace(/"/g, '""') + '"';
      const rows = [
        ['Date', 'Mood', 'Mood Source', 'Prompt', 'Entry', 'AI Log', 'Sentences', 'Grade', 'Grade Note'].map(esc).join(','),
        ...entries.map(e => [e.displayDate || e.date, e.mood ? getMood(e.mood).label : '', e.moodSource||'', e.prompt, e.content || e.text, e.aiLog || '', e.sentences || '', e.grade || '', e.gradeNote || ''].map(esc).join(','))
      ].join('\n');
      downloadBlob(new Blob([rows], { type: 'text/csv' }), 'journal_entries.csv');
    } else if (fmt === 'html') {
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>My Journal</title><style>body{font-family:Georgia,serif;max-width:800px;margin:2rem auto;line-height:1.7;color:#374151}h1{color:#F26A8D;font-size:2rem}h2{color:#2B7A78;border-bottom:2px solid #e5e7eb;padding-bottom:.4rem;margin-top:2.5rem}.prompt{font-style:italic;color:#6b7280;font-size:.9rem}.entry{white-space:pre-wrap;margin:1rem 0}.ailog{background:#f9fafb;padding:1rem;border-radius:8px;font-size:.875rem;margin-top:1rem}.grade{font-weight:bold;color:#2B7A78;margin-top:.75rem}.meta{font-size:.8rem;color:#9ca3af}</style></head><body><h1>My Journal</h1><p class="meta">Exported ${new Date().toLocaleDateString()} | ${entries.length} entries</p>${entries.map(e=>`<div><h2>${e.displayDate||e.date}</h2><p class="prompt">${e.prompt}</p><div class="entry">${(e.content||e.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>${e.aiLog?`<div class="ailog"><strong>AI Interaction Log</strong><br>${e.aiLog.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`:''} ${e.grade?`<p class="grade">Grade: ${e.grade}${e.gradeNote?' — '+e.gradeNote:''}</p>`:''}</div>`).join('')}</body></html>`;
      downloadBlob(new Blob([html], { type: 'text/html' }), 'journal_entries.html');
    }
  };

  const groupEntries = (mode) => {
    const groups = {};
    entries.forEach(e => {
      let key;
      const d = e.date ? new Date(e.date) : new Date();
      if (mode === 'daily') key = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      else if (mode === 'weekly') {
        const s = new Date(d); s.setDate(d.getDate() - d.getDay());
        key = 'Week of ' + s.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      } else key = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    return groups;
  };

  const updateGrade = (id, grade, gradeNote) => {
    setEntries(entries.map(e => e.id === id ? { ...e, grade, gradeNote } : e));
  };

  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const deleteEntry = (id) => {
    if (confirmDeleteId === id) {
      setEntries(entries.filter(e => e.id !== id));
      if (expandedId === id) setExpandedId(null);
      setConfirmDeleteId(null);
    } else {
      setConfirmDeleteId(id);
    }
  };

  const renderEntry = (e) => {
    const m = e.mood ? getMood(e.mood) : null;
    const needsAttention = e.mood != null && e.mood <= 2;
    return (
    <div key={e.id} className={`border rounded-xl overflow-hidden mb-3 fade-in ${needsAttention ? 'border-orange-200' : 'border-gray-200'}`}>
      <button onClick={() => setExpandedId(expandedId === e.id ? null : e.id)}
        className={`w-full flex items-center justify-between px-4 py-3 transition text-sm text-left gap-3 ${needsAttention ? 'bg-orange-50 hover:bg-orange-100' : 'bg-gray-50 hover:bg-gray-100'}`}>
        <div className="flex items-center gap-2 flex-wrap min-w-0">
          {m && <span className="text-base flex-shrink-0" title={m.label + (e.moodSource==='detected'?' (Smart Detection)':'')}>{m.emoji}</span>}
          <span className="font-bold text-gray-800 truncate">{e.displayDate || e.date}</span>
          {e.grade && <span className="bg-brand-teal text-white text-[10px] px-2 py-0.5 rounded-full font-bold flex-shrink-0">{e.grade.split(' — ')[0]}</span>}
          {needsAttention && <span className="text-[10px] font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full flex-shrink-0">Needs Check-in</span>}
          <span className="text-gray-400 text-[11px] flex-shrink-0">{(e.sentences || countSentences(e.content || e.text || ''))} sent.</span>
        </div>
        <span style={{ display: 'inline-block', transform: expandedId === e.id ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform .2s' }}><ChevDown size={15}/></span>
      </button>
      {expandedId === e.id && (
        <div className="p-4 space-y-3">
          {m && (
            <div className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold ${m.bg} ${m.text} border ${m.border}`}>
              {m.emoji} {m.label} {e.moodSource === 'detected' && <span className="opacity-60 font-normal">— Smart Detection</span>}
            </div>
          )}
          {e.prompt && <p className="text-xs text-brand-pink italic">{e.prompt}</p>}
          <p className="text-gray-700 whitespace-pre-wrap text-sm leading-relaxed">{e.content || e.text}</p>
          {e.aiLog && (
            <div className="bg-gray-50 rounded-lg p-3">
              <p className="text-[10px] font-bold text-gray-400 uppercase mb-1">AI Interaction Log</p>
              <p className="text-xs text-gray-600 whitespace-pre-wrap">{e.aiLog}</p>
            </div>
          )}
          {isTeacher && (
            <div className="border-t border-gray-100 pt-3 space-y-2">
              <p className="text-xs font-bold uppercase text-brand-teal">Teacher Feedback</p>
              <div className="flex gap-2 flex-wrap">
                {['4 — Exceeds', '3 — Meets', '2 — Approaching', '1 — Beginning'].map(g => (
                  <button key={g} onClick={() => updateGrade(e.id, g, e.gradeNote || '')}
                    className={`px-3 py-1 rounded-full text-xs font-bold border transition ${e.grade === g ? 'bg-brand-teal text-white border-brand-teal' : 'border-gray-300 text-gray-600 hover:border-brand-teal hover:text-brand-teal'}`}>{g}</button>
                ))}
              </div>
              <textarea value={e.gradeNote || ''} onChange={ev => updateGrade(e.id, e.grade || '', ev.target.value)}
                placeholder="Optional feedback note..." rows={2}
                className="w-full p-2 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-teal-200 resize-none"/>
            </div>
          )}
          <div className="flex items-center gap-4 pt-1 flex-wrap">
            <button onClick={() => downloadEntry(e)} className="text-xs text-brand-teal font-semibold underline hover:opacity-70">↓ Download (.txt)</button>
            <button onClick={() => deleteEntry(e.id)} className={`text-xs font-semibold underline hover:opacity-70 ml-auto transition ${confirmDeleteId === e.id ? 'text-red-600 font-black' : 'text-red-400'}`}>{confirmDeleteId === e.id ? '⚠ Tap again to confirm delete' : 'Delete'}</button>
          </div>
        </div>
      )}
    </div>
    );
  };

  const filteredEntries = entries.filter(e => {
    if (filterFrom && e.date < filterFrom) return false;
    if (filterTo && e.date > filterTo + 'T23:59:59') return false;
    return true;
  }).sort((a,b) => new Date(b.date) - new Date(a.date));

  const groups = view !== 'write' ? groupEntries(view) : null;

  return (
    <Card className="max-w-2xl mx-auto">
      <OnboardingBanner storageKey="journal" title="Your journal saves automatically to this browser. Download anytime so your work is never lost." firstStep={`Write at least ${MIN_SENTENCES} complete sentences to unlock the Save button.`}/>

      <div className="flex items-start justify-between flex-wrap gap-3 mb-6">
        <h2 className="section-header">Journal & AI Log</h2>
        <div className="flex gap-1.5 flex-wrap no-print">
          {[['write', 'New Entry'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']].map(([v, label]) => (
            <button key={v} onClick={() => setView(v)}
              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${view === v ? 'bg-brand-pink text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>{label}</button>
          ))}
        </div>
      </div>

      {view === 'write' && (
        <div className="space-y-4">
          <div className="bg-brand-pink/5 border border-pink-100 p-4 rounded-xl">
            <p className="font-bold text-brand-pink text-sm">Today's Reflection Prompt</p>
            <p className="italic text-gray-700 mt-1">{PROMPT}</p>
          </div>
          <div>
            <textarea value={content} onChange={e => setContent(e.target.value)}
              placeholder="Write your reflection here. Aim for complete thoughts — not bullet points."
              rows={7} className="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-200 focus:outline-none resize-none leading-relaxed"/>
            <div className="flex items-center justify-between mt-1.5">
              <span className={`text-xs font-bold transition ${sentCount >= MIN_SENTENCES ? 'text-brand-teal' : 'text-gray-400'}`}>
                {sentCount} / {MIN_SENTENCES} sentences required {sentCount >= MIN_SENTENCES ? '✓' : ''}
              </span>
              <span className="text-xs text-gray-300">{content.length} chars</span>
            </div>
          </div>
          {content.trim().length > 0 && !canSave && (
            <p className="text-xs text-brand-pink bg-pink-50 border border-pink-100 px-3 py-2 rounded-lg">
              {MIN_SENTENCES - sentCount} more complete sentence{MIN_SENTENCES - sentCount !== 1 ? 's' : ''} needed to save.
            </p>
          )}
          <div>
            <label className="text-xs font-bold uppercase text-gray-400 mb-1.5 block">AI Interaction Log (optional)</label>
            <textarea value={aiLog} onChange={e => setAiLog(e.target.value)}
              placeholder="What did you ask the AI? What did it return? What did you change or reject?"
              rows={3} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-200 focus:outline-none text-sm resize-none"/>
          </div>
          {/* Mood Picker */}
          <div className="space-y-2">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <label className="text-xs font-bold uppercase text-gray-500">How are you feeling right now?</label>
              {suggestedMood && !mood && (
                <span className="text-[10px] text-gray-400 italic">Smart Detection suggests: {getMood(suggestedMood).emoji} {getMood(suggestedMood).label}</span>
              )}
            </div>
            <div className="flex gap-2">
              {MOODS.map(m => (
                <button key={m.val} onClick={() => { const nv = mood === m.val ? null : m.val; setMood(nv); if (nv === 1 || nv === 2) setCrisisDismissed(false); }} title={m.label}
                  className={`flex-1 py-2 rounded-xl border-2 text-center transition text-lg ${mood === m.val ? `${m.bg} ${m.border}` : 'bg-gray-50 border-gray-200 hover:bg-gray-100'}`}>
                  {m.emoji}
                  <div className={`text-[9px] font-bold mt-0.5 ${mood === m.val ? m.text : 'text-gray-400'}`}>{m.label}</div>
                </button>
              ))}
            </div>
            {!mood && suggestedMood && (
              <p className="text-[10px] text-gray-400">No selection = Smart Detection will be used ({getMood(suggestedMood).emoji} {getMood(suggestedMood).label})</p>
            )}
            {(mood === 1 || mood === 2) && !crisisDismissed && (
              <CrisisSupportCard onDismiss={() => setCrisisDismissed(true)} />
            )}
          </div>
          {/* Share with teacher checkbox */}
          <label className="flex items-center gap-3 cursor-pointer select-none">
            <input type="checkbox" checked={shareWithTeacher} onChange={e=>setShareWithTeacher(e.target.checked)}
              className="w-4 h-4 accent-brand-teal"/>
            <span className="text-sm text-gray-600">Share this entry with my teacher</span>
          </label>
          <button onClick={save} disabled={!canSave}
            className={`w-full py-3 rounded-xl font-semibold transition text-white ${canSave ? 'bg-brand-pink hover:opacity-90' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
            {savedFlash ? '✓ Entry Saved!' : 'Save Entry'}
          </button>
          {entries.length > 0 && (
            <div className="pt-4 border-t space-y-2">
              <p className="text-xs font-bold uppercase text-gray-400">Recent Entries (last 3)</p>
              {entries.slice(0, 3).map(renderEntry)}
              <p className="text-xs text-center text-gray-400 pt-1">Use Daily, Weekly, or Monthly view to browse all {entries.length} entries.</p>
            </div>
          )}
        </div>
      )}

      {view !== 'write' && (
        <div className="space-y-5">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <p className="text-sm text-gray-500 font-semibold">{entries.length} {entries.length === 1 ? 'entry' : 'entries'} total</p>
            {entries.length > 0 && (
              <div className="flex gap-2 flex-wrap no-print">
                <button onClick={() => downloadAll('txt')} className="text-xs px-3 py-1.5 border border-gray-300 rounded-lg hover:bg-gray-50 font-semibold text-gray-600 transition">↓ Text (.txt)</button>
                <button onClick={() => downloadAll('csv')} className="text-xs px-3 py-1.5 border border-gray-300 rounded-lg hover:bg-gray-50 font-semibold text-gray-600 transition">↓ Spreadsheet (.csv)</button>
                <button onClick={() => downloadAll('html')} className="text-xs px-3 py-1.5 border border-gray-300 rounded-lg hover:bg-gray-50 font-semibold text-gray-600 transition">↓ Document (.html)</button>
              </div>
            )}
          </div>
          {/* Date range filter */}
          {entries.length > 0 && (
            <div className="flex flex-wrap items-center gap-3 bg-gray-50 rounded-xl p-3 text-sm">
              <span className="font-semibold text-gray-600 text-xs uppercase tracking-wide">Filter by date:</span>
              <div className="flex items-center gap-2">
                <label className="text-xs text-gray-500">From</label>
                <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}
                  className="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-brand-teal"/>
              </div>
              <div className="flex items-center gap-2">
                <label className="text-xs text-gray-500">To</label>
                <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)}
                  className="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-brand-teal"/>
              </div>
              {(filterFrom||filterTo) && (
                <button onClick={()=>{setFilterFrom('');setFilterTo('');}} className="text-xs text-brand-pink underline">Clear</button>
              )}
              {(filterFrom||filterTo) && (
                <span className="text-xs text-gray-400">{filteredEntries.length} of {entries.length} entries</span>
              )}
            </div>
          )}
          {entries.length === 0 && (
            <div className="text-center py-10">
              <p className="text-gray-400 italic">No entries yet.</p>
              <button onClick={() => setView('write')} className="mt-3 text-brand-pink text-sm font-semibold underline">Write your first entry →</button>
            </div>
          )}
          {groups && Object.keys(groups).map(gKey => {
            const groupFiltered = groups[gKey].filter(e => {
              if (filterFrom && e.date < filterFrom) return false;
              if (filterTo && e.date > filterTo + 'T23:59:59') return false;
              return true;
            });
            if (groupFiltered.length === 0) return null;
            return (
            <div key={gKey}>
              <h3 className="text-xs font-bold uppercase tracking-widest text-gray-400 flex items-center gap-2 mb-2">
                <span className="h-px flex-1 bg-gray-200"/> {gKey} <span className="h-px flex-1 bg-gray-200"/>
              </h3>
              {groupFiltered.map(renderEntry)}
            </div>
            );
          })}
        </div>
      )}
    </Card>
  );
};

/* ── LESSON VIEWER ───────────────────────────────────────────────────── */
const NoteField = ({ label, value, onChange, placeholder, rows=2 }) => (
  <div className="space-y-1">
    <label className="text-xs font-bold text-gray-500 uppercase tracking-wide block">{label}</label>
    <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||'Write here...'}
      rows={rows} className="w-full p-3 border border-gray-200 rounded-lg text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-100 resize-none leading-relaxed bg-white/80"/>
  </div>
);

const LessonViewer = ({ lesson, isStudent, isTeacher }) => {
  const key = lesson.title.replace(/\s+/g,'_');
  const [objs, setObjs] = useLS(`lesson_objs_${key}`,{});
  const [steps, setSteps2] = useLS(`lesson_steps_${key}`,{});
  const [reflection, setReflection] = useLS(`lesson_ref_${key}`,'');
  const [done, setDone] = useLS(`lesson_done_${key}`,false);
  const [taught, setTaught] = useLS(`lesson_taught_${key}`,false);
  const [teacherNotes, setTeacherNotes] = useLS(`lesson_tnotes_${key}`,'');
  const [showPrepNotes, setShowPrepNotes] = useState(false);
  const [showPostNotes, setShowPostNotes] = useState(false);

  // Student notes (fill-in-the-blank)
  const defaultSN = { bigIdea:'', surprised:'', confused:'', connection:'', term:'', termDef:'', effort:'', effortWhy:'' };
  const [sNotes, setSNotes] = useLS(`lesson_snotes_${key}`, defaultSN);
  const updateSN = (field, val) => setSNotes(p => ({...p, [field]:val}));
  const [showSNotes, setShowSNotes] = useState(false);

  // Teacher post-lesson notes
  const defaultPN = { worked:'', change:'', followup:'', pacing:'' };
  const [pNotes, setPNotes] = useLS(`lesson_pnotes_${key}`, defaultPN);
  const updatePN = (field, val) => setPNotes(p => ({...p, [field]:val}));

  // AI citation log
  const [usedAI, setUsedAI] = useLS(`lesson_ai_used_${key}`, null);
  const defaultAI = { purpose:'', prompt:'', returned:'', ownIt:'', transform:'' };
  const [aiCite, setAiCite] = useLS(`lesson_ai_cite_${key}`, defaultAI);
  const updateAI = (field, val) => setAiCite(p => ({...p, [field]:val}));
  const [showAILog, setShowAILog] = useState(false);

  const MIN_REFL_SENTENCES = 4;
  const sentCount = reflection.split(/[.!?]+/).filter(s=>s.trim().length>5).length;
  const reflValid = sentCount >= MIN_REFL_SENTENCES;

  const sNotesHasContent = Object.values(sNotes).some(v => v && v.trim());
  const aiLogComplete = usedAI === false || (usedAI === true && Object.values(aiCite).every(v => v && v.trim()));

  const downloadNotes = () => {
    const sn = sNotes;
    const lines = [
      '═'.repeat(50),
      lesson.title,
      'Student Notes — ' + new Date().toLocaleDateString('en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'}),
      '═'.repeat(50),
      '',
      '[ LESSON NOTES ]',
      '',
      '1. The big idea of this lesson, in my own words:',
      sn.bigIdea || '(not completed)',
      '',
      '2. One thing that surprised me:',
      sn.surprised || '(not completed)',
      '',
      '3. Something I still want to understand better:',
      sn.confused || '(not completed)',
      '',
      '4. A real-life connection I can make:',
      sn.connection || '(not completed)',
      '',
      '5. Key term: ' + (sn.term || '___') + '   means: ' + (sn.termDef || '___'),
      '',
      '6. My honest effort level: ' + (sn.effort || '___') + '   because: ' + (sn.effortWhy || '___'),
      '',
      '[ COMPREHENSION REFLECTION ]',
      '',
      lesson.comprehensionQuestion,
      '',
      reflection || '(not completed)',
      '',
      '[ AI INTERACTION LOG ]',
      '',
      'Did I use AI for this lesson? ' + (usedAI === true ? 'YES' : usedAI === false ? 'NO' : 'NOT ANSWERED'),
    ];
    if (usedAI === true) {
      lines.push('', 'P — Purpose (I used AI to help me):',   aiCite.purpose||'(blank)');
      lines.push('',  'I — Input (My exact prompt was):',     aiCite.prompt||'(blank)');
      lines.push('',  'L — Lift (The AI returned):',          aiCite.returned||'(blank)');
      lines.push('',  'O — Own It (I kept/changed/rejected):', aiCite.ownIt||'(blank)');
      lines.push('',  'T — Transform (This helped me):',       aiCite.transform||'(blank)');
    }
    lines.push('', '═'.repeat(50), '© Scholar Vanguard Curriculum');
    const blob = new Blob([lines.join('\n')], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    a.download = lesson.title.replace(/[^a-zA-Z0-9]/g,'_').slice(0,40)+'_notes.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  const CollapsibleHeader = ({open, onToggle, label, icon, filled}) => (
    <button onClick={onToggle}
      className="w-full flex items-center justify-between px-5 py-3 bg-gray-50 hover:bg-gray-100 transition text-sm font-semibold text-gray-700 rounded-xl">
      <span className="flex items-center gap-2">{icon} {label} {filled&&<span className="w-2 h-2 rounded-full bg-brand-teal inline-block"/>}</span>
      <span style={{display:'inline-block',transform:open?'rotate(180deg)':'rotate(0)',transition:'transform .2s'}}><ChevDown size={16}/></span>
    </button>
  );

  return (
    <Card className="max-w-4xl mx-auto">
      {/* Header */}
      <div className="flex justify-between items-start mb-2 flex-wrap gap-3">
        <div className="flex-1 min-w-0">
          <h2 className="section-header">{lesson.title}</h2>
          <p className="text-gray-500 italic mt-1 mb-4">{lesson.topic}</p>
        </div>
        <div className="flex flex-col items-end gap-2 flex-shrink-0">
          {isTeacher&&(
            <button onClick={()=>setTaught(!taught)}
              className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold border-2 transition no-print ${taught?'bg-brand-teal text-white border-brand-teal':'bg-white text-brand-teal border-brand-teal hover:bg-brand-teal/10'}`}>
              {taught?'✓ Taught':'Mark as Taught'}
            </button>
          )}
          {isStudent&&done&&<span className="bg-brand-teal/10 text-brand-teal px-3 py-1 rounded-full text-xs font-bold">⭐ Complete!</span>}
          {isStudent&&<span className="text-[10px] uppercase font-bold text-gray-400">Progress: {Math.round((Object.values(objs).filter(Boolean).length/lesson.objectives.length)*100)}%</span>}
        </div>
      </div>

      {/* Teacher: Prep Notes */}
      {isTeacher&&(
        <div className="no-print mb-4 border border-gray-200 rounded-xl overflow-hidden">
          <CollapsibleHeader open={showPrepNotes} onToggle={()=>setShowPrepNotes(!showPrepNotes)}
            label="Before Teaching: Prep Notes" icon={<Pencil size={15}/>} filled={!!teacherNotes}/>
          {showPrepNotes&&(
            <div className="p-4">
              <textarea value={teacherNotes} onChange={e=>setTeacherNotes(e.target.value)}
                placeholder="Modifications, student accommodations, materials to prep, timing notes..."
                rows={5} className="w-full p-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-100 resize-none"/>
              <p className="text-xs text-gray-400 mt-1">Auto-saved to this device.</p>
            </div>
          )}
        </div>
      )}

      <div className="space-y-8">
        {/* Big Idea */}
        <section>
          <h3 className="card-title flex items-center gap-2"><BrainIcon size={18} cls="text-brand-pink"/> The Big Idea</h3>
          <p className="mt-2 text-gray-700">{lesson.philosophy}</p>
        </section>

        {/* Objectives */}
        <section>
          <h3 className="card-title mb-3">What You'll Be Able to Do</h3>
          <div className="space-y-2">
            {lesson.objectives.map((o,i) => (
              <div key={i} onClick={()=>isStudent&&setObjs(p=>({...p,[i]:!p[i]}))}
                className={`flex items-start gap-3 p-3 rounded-lg border transition ${isStudent?'cursor-pointer hover:border-pink-200':''} ${objs[i]?'bg-brand-pink/5 border-pink-200':'border-transparent bg-gray-50'}`}>
                {isStudent&&<div className={`mt-1 w-5 h-5 rounded border flex items-center justify-center flex-shrink-0 transition ${objs[i]?'bg-brand-pink border-brand-pink text-white':'bg-white border-gray-300'}`}>{objs[i]&&'✓'}</div>}
                <span className={objs[i]?'text-gray-400 line-through':'text-gray-700'}>{o}</span>
              </div>
            ))}
          </div>
        </section>

        {/* Student Notes — fill-in-the-blank (collapsible) */}
        {isStudent&&(
          <section className="border border-yellow-200 rounded-2xl overflow-hidden">
            <div className="bg-yellow-50 px-5 py-3 flex items-center justify-between">
              <CollapsibleHeader open={showSNotes} onToggle={()=>setShowSNotes(!showSNotes)}
                label="My Lesson Notes" icon={<Pencil size={15} cls="text-brand-yellow"/>} filled={sNotesHasContent}/>
            </div>
            {showSNotes&&(
              <div className="p-5 space-y-5 bg-yellow-50/30">
                <p className="text-xs text-gray-500 italic">Fill these in as you go through the lesson. Download at the end to keep or turn in.</p>
                <NoteField label="1. The big idea of this lesson, in my own words:" value={sNotes.bigIdea} onChange={v=>updateSN('bigIdea',v)} placeholder="Explain what this lesson was really about..." rows={3}/>
                <NoteField label="2. One thing that surprised me:" value={sNotes.surprised} onChange={v=>updateSN('surprised',v)} placeholder="Something I didn't expect or that changed my thinking..."/>
                <NoteField label="3. Something I want to understand better or still have a question about:" value={sNotes.confused} onChange={v=>updateSN('confused',v)} placeholder="I'm still not sure about..."/>
                <NoteField label="4. A real-life connection I can make (to my life, another class, or something in the news):" value={sNotes.connection} onChange={v=>updateSN('connection',v)} placeholder="This reminds me of..."/>
                <div className="grid grid-cols-2 gap-3">
                  <NoteField label="5. A key term from this lesson:" value={sNotes.term} onChange={v=>updateSN('term',v)} placeholder="Term..." rows={1}/>
                  <NoteField label="What it means:" value={sNotes.termDef} onChange={v=>updateSN('termDef',v)} placeholder="In my own words..." rows={1}/>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-gray-500 uppercase tracking-wide block">6. My honest effort level today:</label>
                    <select value={sNotes.effort} onChange={e=>updateSN('effort',e.target.value)}
                      className="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-pink-100">
                      <option value="">Select...</option>
                      <option>Full — I gave everything I had</option>
                      <option>Strong — Mostly focused</option>
                      <option>Partial — Got distracted</option>
                      <option>Minimal — Rough day</option>
                    </select>
                  </div>
                  <NoteField label="Because:" value={sNotes.effortWhy} onChange={v=>updateSN('effortWhy',v)} placeholder="Be honest..." rows={1}/>
                </div>
                <button onClick={downloadNotes}
                  className="w-full bg-brand-yellow text-gray-900 font-bold py-3 rounded-xl hover:opacity-90 transition text-sm">
                  ↓ Download My Notes (.txt) — Print or Share
                </button>
              </div>
            )}
          </section>
        )}

        {/* Procedure */}
        <section>
          <h3 className="card-title mb-1">{isStudent?'Activities':'Procedure'}</h3>
          {isStudent && <p className="text-xs text-gray-400 mb-3">Here's what we'll do for this lesson. Check off each step as you finish it.</p>}
          <div className="space-y-6">
            {lesson.procedure.map((p,pi)=>(
              <div key={pi} className="border-l-2 border-pink-100 pl-4">
                <h4 className="font-bold text-gray-800 mb-2">{p.title}</h4>
                <div className="space-y-2">
                  {p.steps.map((s,si)=>{
                    const sk=`${pi}-${si}`;
                    return(
                      <div key={si} onClick={()=>isStudent&&setSteps2(prev=>({...prev,[sk]:!prev[sk]}))}
                        className={`flex items-start gap-3 p-2 rounded transition ${isStudent?'cursor-pointer hover:bg-gray-50':''} ${steps[sk]?'opacity-50':''}`}>
                        {isStudent&&<div className={`mt-0.5 w-4 h-4 rounded-full border flex-shrink-0 transition ${steps[sk]?'bg-brand-teal border-brand-teal':'bg-white border-gray-300'}`}/>}
                        <p className={`text-sm ${steps[sk]?'text-gray-400 line-through':'text-gray-600'}`}>{isStudent ? toStudentVoice(s) : s}</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </section>

        {/* Student: Comprehension & Reflection */}
        {isStudent&&(
          <section className="bg-brand-pink/5 p-6 rounded-2xl border-2 border-pink-200">
            <div className="flex items-center gap-2 mb-3"><Pencil size={20} cls="text-brand-pink"/><h3 className="card-title">Comprehension & Reflection</h3></div>
            <p className="font-medium text-gray-700 mb-4">{lesson.comprehensionQuestion}</p>
            <div className="relative">
              <textarea value={reflection} onChange={e=>setReflection(e.target.value)}
                placeholder={`Reflect deeply... (${MIN_REFL_SENTENCES} sentences required to complete)`} rows={9}
                className="w-full p-5 rounded-xl border-2 border-white bg-white/80 focus:bg-white focus:ring-4 focus:ring-pink-100 focus:outline-none transition leading-relaxed text-gray-800"/>
              <div className={`absolute bottom-4 right-4 px-3 py-1 rounded-full text-xs font-bold ${reflValid?'bg-brand-teal text-white':'bg-brand-pink text-white pulse'}`}>
                {sentCount} / {MIN_REFL_SENTENCES} Sentences
              </div>
            </div>
            {!reflValid&&<p className="mt-2 text-xs text-brand-pink font-semibold uppercase tracking-wider">Keep writing! You need at least {MIN_REFL_SENTENCES} sentences to complete this lesson.</p>}
            {reflValid&&!done&&(
              <div className="mt-4 space-y-3">
                <div className="flex items-center gap-2 text-brand-teal font-bold">⭐ Reflection complete! You're ready to mark this lesson done.</div>
                <button onClick={()=>{
                  setDone(true);
                  // Auto-add suggested task
                  const taskKey = (lesson.title||key).replace(/\s+/g,'_');
                  const suggestedTask = lessonAutoTasks[taskKey];
                  if (suggestedTask) {
                    try {
                      const existingTasks = JSON.parse(localStorage.getItem('tasks')) || [];
                      const alreadyExists = existingTasks.some(t => t.text === suggestedTask);
                      if (!alreadyExists) {
                        const newTask = { id: Date.now(), text: suggestedTask, done: false, source: 'lesson', date: new Date().toISOString().slice(0,10) };
                        localStorage.setItem('tasks', JSON.stringify([...existingTasks, newTask]));
                      }
                    } catch {}
                  }
                  // Sync lesson completion to Firebase
                  if (FB_ENABLED) {
                    const code = getClassCode();
                    const sid = getStudentId();
                    if (code && code !== 'SOLO') {
                      fbPatch(`sv_classrooms/${code}/students/${sid}/lessons/${safeKey(key)}`, {
                        done: true, completedAt: new Date().toISOString()
                      });
                      fbPatch(`sv_classrooms/${code}/students/${sid}/profile`, {lastActive: new Date().toISOString()});
                    }
                  }
                }} className="w-full bg-brand-teal text-white py-3 rounded-xl font-bold text-lg hover:opacity-90 transition">Mark Lesson Complete ✓</button>
              </div>
            )}
            {done&&<div className="mt-4 flex items-center gap-2 text-brand-teal font-bold">⭐ Lesson complete! Outstanding work.</div>}
          </section>
        )}

        {/* Student: AI Interaction Log — P.I.L.O.T. Citation */}
        {isStudent&&(
          <section className="border border-brand-teal/30 rounded-2xl overflow-hidden">
            <div className="bg-brand-teal/5 px-5 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-brand-teal font-black text-sm">AI Log</span>

                        'T — Transform:', aiCite.transform||'(blank)', ''
                      ]:[]),
                      '© Scholar Vanguard P.I.L.O.T. Framework'
                    ];
                    const blob = new Blob([lines.join('\n')],{type:'text/plain'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href=url; a.download=lesson.title.replace(/[^a-zA-Z0-9]/g,'_').slice(0,30)+'_AI_citation.txt';
                    a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);

};

/* ── HOMEWORK SECTION ────────────────────────────────────────────────── */
const HomeworkSection = ({ lesson, isStudent, isTeacher }) => {
  const key = lesson.title.replace(/\s+/g,'_');
  const defHW = { what:'', insight:'', question:'', effort:'' };
  const [hw, setHW] = useLS(`lesson_hw_${key}`, defHW);
  const upHW = (f,v) => setHW(p => ({...p,[f]:v}));
  const [hwGrade, setHWGrade] = useLS(`lesson_hwgrade_${key}`, { score:'', note:'' });
  const hwFilled = hw.what && hw.what.trim();
  const hwComplete = hw.what && hw.insight && hw.effort;

  // Sync homework completion to the teacher dashboard
  useEffect(() => {
    if (!FB_ENABLED || !isStudent || !hwComplete) return;
    const code = getClassCode();
    const sid = getStudentId();
    if (code && code !== 'SOLO') {
      fbPatch(`sv_classrooms/${code}/students/${sid}/lessons/${safeKey(key)}`, { hwDone: true, hwAt: new Date().toISOString() });
    }
  }, [hwComplete]);

  // Multiple choice quiz
  const lessonKey = Object.keys(allLessonPlans).find(k => allLessonPlans[k] === lesson) || '';
  const quiz = lessonQuizzes[lessonKey] || [];
  const [quizState, setQuizState] = useLS(`lesson_quiz_${key}`, { answers:{}, submitted:false });
  const quizAnswered = Object.keys(quizState.answers).length;
  const quizScore = quiz.length > 0 && quizState.submitted ? quiz.filter((q,i) => quizState.answers[i] === q.ans).length : null;

  const dlHW = () => {
    const lines = [
      'HOMEWORK SUBMISSION', lesson.title,
      new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}),
      '─'.repeat(40), '',
      'ASSIGNMENT:', lesson.homework.assignment, '',
      '─'.repeat(40), '',
      ...(quiz.length > 0 && quizState.submitted ? [`Knowledge Check: ${quizScore}/${quiz.length} correct`, ...quiz.map((q,qi)=>`  ${qi+1}. ${quizState.answers[qi]===q.ans?'✓':'✗'} ${q.opts[quizState.answers[qi]!==undefined?quizState.answers[qi]:-1]||'(not answered)'}`), ''] : []),
      '1. What I did:', hw.what||'(not completed)', '',
      '2. Insight from doing it:', hw.insight||'(not completed)', '',
      '3. A question it raised:', hw.question||'(none)', '',
      '4. Effort level:', hw.effort||'(not selected)', '',
      '─'.repeat(40),
      hwGrade.score ? ('Teacher Grade: '+hwGrade.score+(hwGrade.note?'\nFeedback: '+hwGrade.note:'')) : '',
      '', '© Scholar Vanguard'
    ];
    const blob = new Blob([lines.join('\n')],{type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=lesson.title.replace(/[^a-zA-Z0-9]/g,'_').slice(0,30)+'_homework.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  return (
    <section className="border border-brand-teal/30 rounded-2xl overflow-hidden">
      <div className="bg-brand-teal/5 px-5 py-4 flex items-center justify-between">
        <h3 className="card-title flex items-center gap-2"><BookOpen size={18} cls="text-brand-teal"/> Homework</h3>
        <div className="flex items-center gap-2 flex-wrap">
          {quizScore !== null && <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${quizScore === quiz.length ? 'bg-green-100 text-green-700' : quizScore >= Math.ceil(quiz.length*0.6) ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-600'}`}>MC: {quizScore}/{quiz.length}</span>}
          {hwComplete && <span className="text-xs text-brand-teal font-bold bg-brand-teal/10 px-2 py-0.5 rounded-full">✓ Complete</span>}
          {hwGrade.score && <span className="text-xs font-bold bg-white border border-brand-teal text-brand-teal px-2 py-0.5 rounded-full">{hwGrade.score}</span>}
        </div>
      </div>
      <div className="p-5 space-y-5">
        <div className="bg-white border border-gray-100 rounded-xl p-4">
          <p className="text-xs font-bold text-gray-400 uppercase mb-1">Assignment</p>
          <p className="text-gray-800 font-medium leading-relaxed">{lesson.homework.assignment}</p>
        </div>

        {/* Multiple Choice Quiz */}
        {quiz.length > 0 && (
          <div className="space-y-3">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide flex items-center gap-2">
              <span>📝 Knowledge Check</span>
              {quizScore !== null && <span className={`font-black ${quizScore === quiz.length ? 'text-green-600' : quizScore >= Math.ceil(quiz.length*0.6) ? 'text-yellow-600' : 'text-red-500'}`}>{quizScore}/{quiz.length} correct</span>}
            </p>
            {isStudent && quiz.map((q, qi) => {
              const isSubmitted = quizState.submitted;
              const selected = quizState.answers[qi];
              const isCorrect = selected === q.ans;
              return (
                <div key={qi} className={`rounded-xl border p-4 space-y-2.5 transition-colors ${isSubmitted ? (isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-200') : 'bg-white border-gray-200'}`}>
                  <p className="text-sm font-semibold text-gray-800">{qi + 1}. {q.q}</p>
                  <div className="space-y-1.5">
                    {q.opts.map((opt, oi) => {
                      const isSelected = selected === oi;
                      const isAns = oi === q.ans;
                      let cls = 'border-gray-200 text-gray-700 hover:border-brand-teal';
                      if (isSubmitted) {
                        if (isAns) cls = 'border-green-400 bg-green-100 text-green-800 font-bold';
                        else if (isSelected) cls = 'border-red-300 bg-red-50 text-red-600 line-through';
                        else cls = 'border-gray-100 text-gray-400';
                      } else if (isSelected) {
                        cls = 'border-brand-teal bg-brand-teal/10 text-brand-teal font-semibold';
                      }
                      return (
                        <button key={oi} disabled={isSubmitted}
                          onClick={() => !isSubmitted && setQuizState(p => ({...p, answers:{...p.answers,[qi]:oi}}))}
                          className={`w-full text-left text-sm px-4 py-2 rounded-lg border-2 transition ${cls} ${!isSubmitted ? 'cursor-pointer' : 'cursor-default'}`}>
                          {String.fromCharCode(65+oi)}. {opt}
                        </button>
                      );
                    })}
                  </div>
                  {isSubmitted && (
                    <p className={`text-xs font-bold ${isCorrect ? 'text-green-700' : 'text-red-600'}`}>
                      {isCorrect ? '✓ Correct!' : `✗ Correct answer: ${q.opts[q.ans]}`}
                    </p>
                  )}
                </div>
              );
            })}
            {isStudent && !quizState.submitted && (
              <button disabled={quizAnswered < quiz.length}
                onClick={() => {
                  setQuizState(p => ({...p, submitted:true}));
                  // Sync quiz score to Firebase
                  if (FB_ENABLED) {
                    const code = getClassCode();
                    const sid = getStudentId();
                    if (code && code !== 'SOLO') {
                      const score = quiz.filter((q,i) => quizState.answers[i] === q.ans).length;
                      fbPatch(`sv_classrooms/${code}/students/${sid}/lessons/${safeKey(key)}`, {
                        quizScore: score, quizTotal: quiz.length, quizSubmittedAt: new Date().toISOString()
                      });
                      fbPatch(`sv_classrooms/${code}/students/${sid}/profile`, {lastActive: new Date().toISOString()});
                    }
                  }
                }}
                className={`w-full py-3 rounded-xl font-bold text-sm transition ${quizAnswered < quiz.length ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-brand-pink text-white hover:opacity-90'}`}>
                {quizAnswered < quiz.length ? `Answer all ${quiz.length} questions to submit` : 'Submit Answers'}
              </button>
            )}
            {isStudent && quizState.submitted && (
              <div className={`rounded-xl p-4 text-center border ${quizScore === quiz.length ? 'bg-green-50 border-green-300' : quizScore >= Math.ceil(quiz.length*0.6) ? 'bg-yellow-50 border-yellow-200' : 'bg-red-50 border-red-200'}`}>
                <p className="font-black text-2xl">{quizScore}/{quiz.length}</p>
                <p className="text-sm mt-1 text-gray-600">{quizScore === quiz.length ? '🔥 Perfect score!' : quizScore >= Math.ceil(quiz.length*0.6) ? '👍 Good effort — review the ones you missed.' : '📚 Review the lesson and try again when ready.'}</p>
                {quizScore < quiz.length && <button onClick={() => setQuizState({answers:{}, submitted:false})} className="mt-2 text-xs text-brand-pink underline font-bold">Reset & Retry</button>}
              </div>
            )}
            {isTeacher && quiz.length > 0 && (
              quizState.submitted ? (
                <div className="bg-gray-50 rounded-xl p-3 border border-gray-200">
                  <p className="text-xs font-bold text-gray-400 uppercase mb-2">Knowledge Check Score</p>
                  <p className={`font-black text-xl mb-2 ${quizScore === quiz.length ? 'text-green-600' : quizScore >= Math.ceil(quiz.length*0.6) ? 'text-yellow-600' : 'text-red-500'}`}>{quizScore}/{quiz.length} correct</p>
                  {quiz.map((q,qi) => {
                    const studentAns = quizState.answers[qi];
                    const correct = studentAns === q.ans;
                    return (
                      <div key={qi} className="text-xs text-gray-600 mt-1.5 border-t border-gray-100 pt-1.5">
                        <span className={`font-bold mr-1 ${correct?'text-green-600':'text-red-500'}`}>{correct?'✓':'✗'}</span>
                        <span className="text-gray-500">Q{qi+1}:</span> <span className={correct?'text-green-700':'text-red-600 line-through'}>{studentAns!==undefined?q.opts[studentAns]:'(not answered)'}</span>
                        {!correct && <span className="text-green-700 ml-1">→ {q.opts[q.ans]}</span>}
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="bg-gray-50 rounded-xl p-3 border border-dashed border-gray-200">
                  <p className="text-xs text-gray-400 font-semibold">Knowledge Check not yet attempted by student.</p>
                </div>
              )
            )}
            {quiz.length > 0 && isStudent && <div className="border-t border-gray-100 pt-1"/>}
          </div>
        )}

        {isStudent && (
          <>
            <p className="text-xs text-gray-400 italic">Fill in after finishing. Download or print to turn in.</p>
            <NoteField label="1. What I did for this homework:" value={hw.what} onChange={v=>upHW('what',v)} placeholder="Describe what you actually did — be specific..." rows={3}/>
            <NoteField label="2. One insight or new understanding:" value={hw.insight} onChange={v=>upHW('insight',v)} placeholder="What did doing this homework help you realize?"/>
            <NoteField label="3. A question this homework raised: (optional)" value={hw.question} onChange={v=>upHW('question',v)} placeholder="What do you still want to know?" rows={1}/>
            <div className="space-y-1">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide block">4. Honest effort level:</label>
              <select value={hw.effort} onChange={e=>upHW('effort',e.target.value)} className="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-100">
                <option value="">Select...</option>
                <option>Full — I gave everything</option>
                <option>Strong — Mostly focused</option>
                <option>Partial — Got distracted</option>
                <option>Minimal — Rough night</option>
              </select>
            </div>
            <div className="flex gap-3">
              <button onClick={dlHW} className="flex-1 bg-brand-teal text-white font-bold py-2.5 rounded-xl hover:opacity-90 transition text-sm">↓ Download (.txt)</button>
              <button onClick={()=>window.print()} className="px-4 py-2.5 border-2 border-brand-teal text-brand-teal font-bold rounded-xl hover:bg-teal-50 transition text-sm no-print">Print</button>
            </div>
            {hwGrade.score && (
              <div className="bg-brand-teal/5 border border-brand-teal/20 rounded-xl p-4">
                <p className="text-xs font-bold text-brand-teal uppercase mb-1">Teacher Feedback</p>
                <p className="text-sm font-bold">{hwGrade.score}</p>
                {hwGrade.note && <p className="text-sm text-gray-600 mt-1">{hwGrade.note}</p>}
              </div>
            )}
          </>
        )}

        {isTeacher && (
          <div className="space-y-3">
            {hwFilled ? (
              <>
                <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">Student Responses</p>
                {[['What they did:', hw.what],['Insight:', hw.insight],['Question:', hw.question],['Effort:', hw.effort]].map(([lbl,val])=> val ? (
                  <div key={lbl} className="bg-gray-50 rounded-lg p-3">
                    <p className="text-[10px] font-bold text-gray-400 uppercase mb-1">{lbl}</p>
                    <p className="text-sm text-gray-700">{val}</p>
                  </div>
                ) : null)}
                <div className="border-t pt-3 space-y-2">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-xs font-bold text-brand-teal uppercase">Quick Grade</p>
                    {hwGrade.score && <span className="text-xs text-brand-teal font-bold">{hwGrade.score} ✓</span>}
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {['4 — Exceeds','3 — Meets','2 — Approaching','1 — Beginning'].map(s=>(
                      <button key={s} onClick={()=>setHWGrade(p=>({...p,score:s}))}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition ${hwGrade.score===s?'bg-brand-teal border-brand-teal text-white':'border-gray-200 text-gray-600 hover:border-brand-teal'}`}>{s}</button>
                    ))}
                  </div>
                  <input value={hwGrade.note} onChange={e=>setHWGrade(p=>({...p,note:e.target.value}))} placeholder="Optional feedback..." className="w-full p-2 border border-gray-200 rounded-lg text-xs focus:outline-none"/>
                </div>
              </>
            ) : (
              <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-xs text-yellow-700 font-semibold">No homework response submitted yet.</div>
            )}
            <button onClick={dlHW} className="text-xs text-brand-teal underline font-semibold">↓ Download response (.txt)</button>
          </div>
        )}
      </div>
    </section>
  );
