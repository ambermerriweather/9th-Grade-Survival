/* ── CLASS MOOD TREND CHART ──────────────────────────────────────────── */
const MoodTrendChart = ({ students }) => {
  const studentList = Object.values(students);
  if (!studentList.length) return null;

  const today = new Date();
  const days = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(today);
    d.setDate(today.getDate() - (13 - i));
    return d.toISOString().slice(0, 10);
  });

  const dayAvgs = days.map(day => {
    const vals = studentList.flatMap(s => {
      const m = Array.isArray(s.moods) ? s.moods : Object.values(s.moods || {});
      return m.filter(e => (e.date || '').slice(0, 10) === day && e.mood != null).map(e => e.mood);
    });
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  });

  const hasAnyData = dayAvgs.some(v => v != null);
  if (!hasAnyData) return null;

  const W = 560, H = 150, padL = 28, padR = 12, padT = 12, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const toX = (i) => padL + (i / 13) * chartW;
  const toY = (val) => padT + chartH - ((val - 1) / 4) * chartH;

  const validPoints = dayAvgs.map((avg, i) => avg != null ? { x: toX(i), y: toY(avg), avg, day: days[i], i } : null).filter(Boolean);

  const studentAvgs = studentList
    .map(s => {
      const m = Array.isArray(s.moods) ? s.moods : Object.values(s.moods || {});
      const recent = m.filter(e => e.mood != null).slice(-14);
      const avg = recent.length ? recent.reduce((a, b) => a + b.mood, 0) / recent.length : null;
      return { name: s.profile?.name || 'Student', avg, moods: m };
    })
    .filter(s => s.avg != null)
    .sort((a, b) => a.avg - b.avg)
    .slice(0, 5);

  return (
    <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div>
        <p className="text-xs text-gray-400 font-bold uppercase tracking-widest">Class Mood Trend</p>
        <h3 className="font-black text-gray-900 text-base mt-0.5">14-Day Average Mood</h3>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:'auto',display:'block'}}>
        {/* Grid lines */}
        {[1,2,3,4,5].map(v => (
          <line key={v} x1={padL} y1={toY(v)} x2={W-padR} y2={toY(v)} stroke="#f3f4f6" strokeWidth="1"/>
        ))}
        {/* Y axis emoji labels */}
        {[{v:5,e:'🔥'},{v:3,e:'😐'},{v:1,e:'😞'}].map(({v,e}) => (
          <text key={v} x={padL-4} y={toY(v)+4} textAnchor="end" fontSize="11" fill="#9ca3af">{e}</text>
        ))}
        {/* X axis date labels every ~3 days */}
        {days.map((day, i) => {
          if (i !== 0 && i !== 3 && i !== 6 && i !== 9 && i !== 13) return null;
          return (
            <text key={day} x={toX(i)} y={H-4} textAnchor="middle" fontSize="9" fill="#9ca3af">
              {new Date(day+'T12:00:00Z').toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}
            </text>
          );
        })}
        {/* Teal connecting line */}
        {validPoints.length > 1 && (
          <polyline
            points={validPoints.map(p=>`${p.x},${p.y}`).join(' ')}
            fill="none" stroke="#2B7A78" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
        )}
        {/* Dots — red if avg ≤ 2.5 */}
        {validPoints.map((p, idx) => (
          <circle key={idx} cx={p.x} cy={p.y} r="5"
            fill={p.avg <= 2.5 ? '#ef4444' : '#2B7A78'} stroke="white" strokeWidth="2"/>
        ))}
      </svg>

      {/* Sparkline row — 5 lowest avg students */}
      {studentAvgs.length > 0 && (
        <div>
          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Students Needing Most Support</p>
          <div className="space-y-2">
            {studentAvgs.map(s => {
              const last7 = s.moods.filter(m => m.mood != null).slice(-7);
              const spW = 80, spH = 22;
              const spPts = last7.map((m, i) => ({
                x: last7.length > 1 ? (i / (last7.length - 1)) * spW : spW / 2,
                y: spH - ((m.mood - 1) / 4) * spH
              }));
              return (
                <div key={s.name} className="flex items-center gap-3">
                  <span className="text-xs font-semibold text-gray-700 w-24 truncate flex-shrink-0">{s.name}</span>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${s.avg <= 2 ? 'bg-red-100 text-red-600' : 'bg-yellow-100 text-yellow-700'}`}>{s.avg.toFixed(1)}</span>
                  {spPts.length > 1 && (
                    <svg viewBox={`0 0 ${spW} ${spH}`} style={{width:80,height:22,flexShrink:0}}>
                      <polyline points={spPts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}
                        fill="none" stroke={s.avg <= 2.5 ? '#ef4444' : '#2B7A78'} strokeWidth="1.5" strokeLinejoin="round"/>
                    </svg>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

/* ── TEACHER CLASS MANAGER ───────────────────────────────────────────── */
const TeacherClassManager = () => {
  const [myCode, setMyCode] = useLS('sv_teacher_class_code', '');
  const [teacherName, setTeacherName] = useLS('sv_teacher_name', '');
  const [students, setStudents] = useState({});
  const [loading, setLoading] = useState(false);
  const [creating, setCreating] = useState(false);
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [activeCareEntry, setActiveCareEntry] = useState(null);

  const addCareLog = async (sid, action) => {
    if (!action || !myCode) return;
    const key = Date.now().toString();
    const entry = { at: new Date().toISOString(), action };
    if (FB_ENABLED) await fbPatch(`sv_classrooms/${myCode}/students/${sid}/careLog`, { [key]: entry });
    setStudents(prev => ({
      ...prev,
      [sid]: { ...prev[sid], careLog: { ...(prev[sid]?.careLog || {}), [key]: entry } }
    }));
    setActiveCareEntry(null);
  };

  const loadStudents = async (code) => {
    if (!FB_ENABLED || !code) return;
    setLoading(true);
    const data = await fbRead(`sv_classrooms/${code}/students`);
    setStudents(data || {});
    setLastRefresh(new Date());
    setLoading(false);
  };

  useEffect(() => { if (myCode && myCode !== '') loadStudents(myCode); }, [myCode]);

  const createClass = async () => {
    if (!teacherName.trim()) return;
    setCreating(true);
    const code = genClassCode();
    if (FB_ENABLED) {
      const createdAt = new Date().toISOString();
      await fbWrite(`sv_classrooms/${code}/info`, {
        teacherName: teacherName.trim(), createdAt, classCode: code
      });
      await fbWrite(`sv_admin/classroomIndex/${code}`, {
        teacherName: teacherName.trim(), createdAt
      });
    }
    setMyCode(code);
    setCreating(false);
    loadStudents(code);
  };

  const copyCode = () => { navigator.clipboard.writeText(myCode).catch(()=>{}); };

  if (!FB_ENABLED) return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-6 space-y-2">
      <p className="font-bold text-amber-800">Firebase Setup Required</p>
      <p className="text-sm text-amber-700">To see student data on your dashboard, you need to connect a Firebase Realtime Database. Follow the setup guide below.</p>
      <div className="bg-white rounded-xl p-4 text-sm space-y-2 border border-amber-100">
        <p className="font-bold text-gray-800">Quick Setup (5 minutes):</p>
        <ol className="list-decimal list-inside space-y-1 text-gray-600">
          <li>Go to <strong>console.firebase.google.com</strong></li>
          <li>Click <strong>Add project</strong> (or select your existing Google Cloud project)</li>
          <li>In your project, click <strong>Build → Realtime Database</strong></li>
          <li>Click <strong>Create Database</strong> → choose your region → <strong>Start in test mode</strong></li>
          <li>Copy the database URL (looks like: <code className="bg-gray-100 px-1 rounded">https://your-project-default-rtdb.firebaseio.com</code>)</li>
          <li>Open <strong>standalone.html</strong> and replace <code className="bg-gray-100 px-1 rounded">YOUR_FIREBASE_DATABASE_URL</code> at the top of the script with your URL</li>
          <li>Save, redeploy, and come back here</li>
        </ol>
      </div>
    </div>
  );

  if (!myCode) return (
    <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div>
        <p className="text-xs text-gray-400 font-bold uppercase tracking-widest">Class Setup</p>
        <h2 className="font-black text-gray-900 text-lg mt-0.5">Create Your Classroom</h2>
        <p className="text-sm text-gray-500 mt-1">Generate a class code to share with your students. They enter it when they first open the app.</p>
      </div>
      <div>
        <label className="text-xs font-bold text-gray-600 uppercase tracking-wide">Your Name</label>
        <input value={teacherName} onChange={e=>setTeacherName(e.target.value)} placeholder="Ms. Johnson" className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-teal" />
      </div>
      <button onClick={createClass} disabled={creating || !teacherName.trim()} className="bg-brand-teal text-white font-bold px-6 py-3 rounded-xl hover:opacity-90 transition disabled:opacity-50">
        {creating ? 'Creating...' : 'Generate Class Code'}
      </button>
    </div>
  );

  const tierRank = { red: 0, yellow: 1 };
  const studentList = Object.entries(students).sort(([, a], [, b]) => {
    const ta = tierRank[getMoodTier(a.moods || [], a.journal || [])] ?? 2;
    const tb = tierRank[getMoodTier(b.moods || [], b.journal || [])] ?? 2;
    return ta - tb;
  });
  const allLessons = Object.values(allLessonPlans).filter(l => !l.placeholder);
  const totalLessonsCount = allLessons.length;

  return (
    <div className="space-y-5">
      {/* Class code banner */}
      <div className="bg-brand-teal text-white rounded-2xl p-5 flex flex-wrap items-center gap-4">
        <div className="flex-1">
          <p className="text-xs font-bold uppercase tracking-widest opacity-70">Your Class Code</p>
          <p className="text-4xl font-black tracking-widest font-mono mt-1">{myCode}</p>
          <p className="text-xs opacity-70 mt-1">Share this with your students. They enter it on first login.</p>
        </div>
        <div className="flex flex-col gap-2">
          <button onClick={copyCode} className="bg-white text-brand-teal font-bold px-4 py-2 rounded-xl text-sm hover:opacity-90 transition">Copy Code</button>
          <button onClick={() => loadStudents(myCode)} className="bg-white/20 text-white font-semibold px-4 py-2 rounded-xl text-sm hover:bg-white/30 transition">
            {loading ? 'Refreshing...' : '↻ Refresh Roster'}
          </button>
        </div>
      </div>

      {/* Mood trend chart */}
      {studentList.length > 0 && <MoodTrendChart students={students}/>}

      {/* Student roster */}
      <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <p className="text-xs text-gray-400 font-bold uppercase tracking-widest">Student Roster</p>
            <h3 className="font-black text-gray-900 text-base mt-0.5">{studentList.length} Student{studentList.length !== 1 ? 's' : ''} Enrolled</h3>
          </div>
          {lastRefresh && <p className="text-xs text-gray-400">Updated {lastRefresh.toLocaleTimeString()}</p>}
        </div>

        {studentList.length === 0 ? (
          <div className="text-center py-10 space-y-2">
            <div className="text-4xl">👋</div>
            <p className="text-gray-500 font-semibold">No students yet</p>
            <p className="text-sm text-gray-400">Share code <strong>{myCode}</strong> with your class. Students appear here once they enroll.</p>
          </div>
        ) : (
          <div className="space-y-3">
            {studentList.map(([sid, sdata]) => {
              const profile = sdata.profile || {};
              const lessons = sdata.lessons || {};
              const moods = sdata.moods || [];
              const journal = sdata.journal || [];
              const doneLessons = Object.values(lessons).filter(l => l.done).length;
              const lastActive = profile.lastActive ? new Date(profile.lastActive) : null;
              const recentMoods = Array.isArray(moods) ? moods.slice(-7) : Object.values(moods).slice(-7);
              const avgMood = recentMoods.length ? Math.round(recentMoods.reduce((s,m)=>s+(m.mood||3),0)/recentMoods.length) : null;
              const flaggedMoods = (Array.isArray(moods) ? moods : Object.values(moods)).filter(m => m.mood != null && m.mood <= 2);
              const sharedJournal = (Array.isArray(journal) ? journal : Object.values(journal)).filter(j => j.shared);
              const quizLessons = Object.entries(lessons).filter(([,v]) => v.quizScore != null);
              const hwLessons = Object.entries(lessons).filter(([,v]) => v.hwDone);
              const moodObj = avgMood ? getMood(avgMood) : null;
              const isSelected = selectedStudent === sid;

              return (
                <div key={sid} className="border border-gray-100 rounded-xl overflow-hidden">
                  <button onClick={() => setSelectedStudent(isSelected ? null : sid)} className="w-full text-left p-4 hover:bg-gray-50 transition">
                    <div className="flex items-center gap-3 flex-wrap">
                      <div className="w-10 h-10 bg-brand-pink/10 rounded-full flex items-center justify-center font-bold text-brand-pink text-base flex-shrink-0">
                        {(profile.name||'?')[0].toUpperCase()}
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="font-bold text-gray-900">{profile.name || 'Unknown Student'}</p>
                        <p className="text-xs text-gray-400">
                          Last active: {lastActive ? lastActive.toLocaleDateString() : 'Never'} •
                          {doneLessons}/{totalLessonsCount} lessons
                        </p>
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        {getMoodTier(moods, journal) === 'red' && (
                          <span className="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full">🚨 Language alert</span>
                        )}
                        {getMoodTier(moods, journal) === 'yellow' && (
                          <span className="bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded-full">⚠ Mood watch</span>
                        )}
                        {moodObj && <span className="text-xl" title={`Avg mood: ${moodObj.label}`}>{moodObj.emoji}</span>}
                        <span className="text-gray-300 text-sm">{isSelected ? '▲' : '▼'}</span>
                      </div>
                    </div>
                  </button>

                  {isSelected && (
                    <div className="border-t border-gray-100 p-4 space-y-4 bg-gray-50/50">
                      {/* Progress bars */}
                      <div>
                        <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Lesson Progress</p>
                        <div className="flex items-center gap-3">
                          <div className="flex-1 bg-gray-200 rounded-full h-3">
                            <div className="bg-brand-teal h-3 rounded-full transition-all" style={{width: totalLessonsCount > 0 ? `${(doneLessons/totalLessonsCount)*100}%` : '0%'}}/>
                          </div>
                          <span className="text-sm font-bold text-brand-teal">{doneLessons}/{totalLessonsCount}</span>
                        </div>
                        {/* Individual lesson dots */}
                        {doneLessons > 0 && (
                          <div className="mt-2 flex flex-wrap gap-1">
                            {Object.entries(lessons).filter(([,v])=>v.done).map(([k,v])=>(
                              <span key={k} className="bg-brand-teal/10 text-brand-teal text-xs px-2 py-0.5 rounded-full font-medium">{k.replace(/_/g,' ')}</span>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Knowledge check scores */}
                      {quizLessons.length > 0 && (
                        <div>
                          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Knowledge Checks ({quizLessons.length})</p>
                          <div className="flex flex-wrap gap-1.5">
                            {quizLessons.map(([k,v])=>(
                              <span key={k} className={`text-xs px-2 py-0.5 rounded-full font-bold ${v.quizScore === v.quizTotal ? 'bg-green-100 text-green-700' : v.quizScore >= Math.ceil((v.quizTotal||3)*0.6) ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-600'}`}>
                                {k.replace(/_/g,' ')}: {v.quizScore}/{v.quizTotal}
                              </span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Homework submitted */}
                      {hwLessons.length > 0 && (
                        <div>
                          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Homework Submitted ({hwLessons.length})</p>
                          <div className="flex flex-wrap gap-1.5">
                            {hwLessons.map(([k])=>(
                              <span key={k} className="bg-brand-yellow/20 text-yellow-800 text-xs px-2 py-0.5 rounded-full font-medium">✓ {k.replace(/_/g,' ')}</span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Mood history */}
                      {recentMoods.length > 0 && (
                        <div>
                          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Recent Moods (last 7)</p>
                          <div className="flex gap-2 flex-wrap">
                            {recentMoods.map((m, i) => {
                              const mo = getMood(m.mood);
                              return mo ? (
                                <span key={i} className={`text-lg ${m.mood <= 2 ? 'ring-2 ring-red-400 rounded-full' : ''}`} title={`${m.date ? m.date.slice(0,10) : ''}: ${mo.label}`}>{mo.emoji}</span>
                              ) : null;
                            })}
                          </div>
                        </div>
                      )}

                      {/* Flagged moods */}
                      {flaggedMoods.length > 0 && (
                        <div className="bg-red-50 border border-red-200 rounded-xl p-3 space-y-2">
                          <p className="text-xs font-bold text-red-700 uppercase tracking-wide">⚠ Needs Attention ({flaggedMoods.length})</p>
                          {flaggedMoods.slice(-3).reverse().map((m, i) => (
                            <div key={i} className="text-sm text-red-700">
                              <span className="font-semibold">{m.date ? m.date.slice(0,10) : ''}</span>
                              {m.note && <span className="text-red-600 ml-2">"{m.note}"</span>}
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Shared journal */}
                      {sharedJournal.length > 0 && (
                        <div>
                          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Shared Journal Entries ({sharedJournal.length})</p>
                          <div className="space-y-2">
                            {sharedJournal.slice(-3).reverse().map((j, i) => (
                              <div key={i} className="bg-white border border-gray-200 rounded-xl p-3 text-sm">
                                <p className="text-xs text-gray-400 mb-1">{j.date ? j.date.slice(0,10) : ''}</p>
                                <p className="text-gray-700 leading-relaxed">{j.text ? j.text.slice(0,300) : ''}{j.text && j.text.length > 300 ? '...' : ''}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {sharedJournal.length === 0 && recentMoods.length === 0 && doneLessons === 0 && quizLessons.length === 0 && hwLessons.length === 0 && (
                        <p className="text-sm text-gray-400 italic text-center py-2">Student has not completed any activities yet.</p>
                      )}

                      {/* Care log */}
                      <div className="border border-gray-200 rounded-xl p-3 space-y-2">
                        <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">Care Log</p>
                        {Object.entries(sdata.careLog || {})
                          .sort(([,a],[,b]) => (b.at||'') > (a.at||'') ? 1 : -1)
                          .map(([k,entry]) => (
                            <div key={k} className="flex items-start gap-2 text-xs border-t border-gray-100 pt-2 first:border-0 first:pt-0">
                              <span className="text-gray-400 flex-shrink-0 w-20">{entry.at ? new Date(entry.at).toLocaleDateString() : ''}</span>
                              <span className="text-gray-700 font-medium">{entry.action}</span>
                            </div>
                          ))}
                        {activeCareEntry?.sid === sid ? (
                          <div className="space-y-2 pt-1">
                            <select
                              value={activeCareEntry.action}
                              onChange={e => setActiveCareEntry({...activeCareEntry, action: e.target.value})}
                              className="w-full text-sm px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-brand-teal"
                            >
                              <option value="">Select action taken...</option>
                              <option value="Acknowledged — monitoring">Acknowledged — monitoring</option>
                              <option value="Spoke with student">Spoke with student</option>
                              <option value="Counselor notified">Counselor notified</option>
                              <option value="Parent/guardian contacted">Parent/guardian contacted</option>
                              <option value="Resolved — no further action needed">Resolved — no further action needed</option>
                            </select>
                            <div className="flex gap-2">
                              <button
                                onClick={() => addCareLog(sid, activeCareEntry.action)}
                                disabled={!activeCareEntry.action}
                                className="bg-brand-teal text-white text-xs font-bold px-4 py-2 rounded-xl disabled:opacity-40 hover:opacity-90 transition"
                              >Save</button>
                              <button onClick={() => setActiveCareEntry(null)} className="text-gray-400 text-xs px-3 py-2 hover:text-gray-600 transition">Cancel</button>
                            </div>
                          </div>
                        ) : (
                          <button
                            onClick={() => setActiveCareEntry({ sid, action: '' })}
                            className="text-xs text-brand-teal font-bold border border-brand-teal/30 px-3 py-1.5 rounded-xl hover:bg-brand-teal/5 transition"
                          >+ Acknowledge / Log Action</button>
                        )}
                      </div>

                      {/* Counselor summary print button */}
                      <div className="pt-1 flex justify-end">
                        <button
                          onClick={() => printCounselorSummary(sid, sdata, myCode, totalLessonsCount)}
                          className="text-xs font-bold text-gray-500 border border-gray-200 px-4 py-2 rounded-xl hover:bg-gray-50 transition"
                        >🖨 Print Counselor Summary</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Aggregate Gradebook */}
      {studentList.length > 1 && (
        <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
          <div>
            <p className="text-xs text-gray-400 font-bold uppercase tracking-widest">Class Overview</p>
            <h3 className="font-black text-gray-900 text-base mt-0.5">Aggregate Gradebook</h3>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            {[
              {
                val: studentList.length,
                label: 'Enrolled',
                color: 'text-brand-teal'
              },
              {
                val: Math.round(studentList.reduce((sum,[,s])=>sum+Object.values(s.lessons||{}).filter(l=>l.done).length,0)/studentList.length) || 0,
                label: 'Avg Lessons Done',
                color: 'text-brand-pink'
              },
              {
                val: studentList.filter(([,s])=>{
                  const moods = Array.isArray(s.moods)?s.moods:Object.values(s.moods||{});
                  return moods.some(m=>m.mood!=null&&m.mood<=2);
                }).length,
                label: 'Need Attention',
                color: 'text-red-500'
              },
              {
                val: (() => {
                  const allMoods = studentList.flatMap(([,s])=>Array.isArray(s.moods)?s.moods:Object.values(s.moods||{})).filter(m=>m.mood!=null);
                  return allMoods.length ? (allMoods.reduce((s,m)=>s+m.mood,0)/allMoods.length).toFixed(1) : 'N/A';
                })(),
                label: 'Class Avg Mood',
                color: 'text-brand-yellow'
              },
            ].map(({val,label,color})=>(
              <div key={label} className="bg-gray-50 rounded-xl p-3">
                <div className={`text-2xl font-black ${color}`}>{val}</div>
                <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">{label}</div>
              </div>
            ))}
          </div>
          {/* Lesson completion bar per student */}
          <div>
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Lesson Completion by Student</p>
            <div className="space-y-2">
              {studentList.map(([sid,s])=>{
                const done = Object.values(s.lessons||{}).filter(l=>l.done).length;
                const pct = totalLessonsCount>0?Math.round((done/totalLessonsCount)*100):0;
                return (
                  <div key={sid} className="flex items-center gap-3">
                    <span className="text-xs font-semibold text-gray-600 w-24 truncate flex-shrink-0">{s.profile?.name||'Student'}</span>
                    <div className="flex-1 bg-gray-100 rounded-full h-2.5">
                      <div className="bg-brand-teal h-2.5 rounded-full transition-all" style={{width:`${pct}%`}}/>
                    </div>
                    <span className="text-xs text-gray-400 w-8 text-right flex-shrink-0">{pct}%</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── TEACHER STATS ───────────────────────────────────────────────────── */
const TeacherStats = () => {
  const entries  = (() => { try { return JSON.parse(localStorage.getItem('journal'))||[]; } catch { return []; } })();
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const thisWeek = entries.filter(e => new Date(e.date) >= weekAgo);
  const moodEntries = thisWeek.filter(e => e.mood != null);
  const avgMoodVal = moodEntries.length ? Math.round(moodEntries.reduce((s,e)=>s+(e.mood||3),0)/moodEntries.length) : null;
  const avgMood = avgMoodVal ? getMood(avgMoodVal) : null;
  const flaggedCount = entries.filter(e => e.mood != null && e.mood <= 2).length;
  const flagged = entries.filter(e => e.mood != null && e.mood <= 2).sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,5);
  const todayEntries = entries.filter(e => new Date(e.date).toDateString() === now.toDateString());

  const lessons = Object.values(allLessonPlans).filter(l=>!l.placeholder);
  const doneLessons  = lessons.filter(l=>{ try{return JSON.parse(localStorage.getItem(`lesson_done_${l.title.replace(/\s+/g,'_')}`))}catch{return false} }).length;
  const hwDone = lessons.filter(l=>{ try{const h=JSON.parse(localStorage.getItem(`lesson_hw_${l.title.replace(/\s+/g,'_')}`));return h&&h.what&&h.what.trim()}catch{return false} }).length;
  const moodCounts = MOODS.map(m=>({...m, count:moodEntries.filter(e=>e.mood===m.val).length})).filter(m=>m.count>0);
  const today = now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  return (
    <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-6">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          <p className="text-xs text-gray-400 font-bold uppercase tracking-widest">Daily Brief</p>
          <h2 className="font-black text-gray-900 text-lg mt-0.5">{today}</h2>
        </div>
        {avgMood ? (
          <div className={`flex items-center gap-2 px-4 py-2 rounded-xl border ${avgMood.bg} ${avgMood.border}`}>
            <span className="text-2xl">{avgMood.emoji}</span>
            <div><p className={`text-xs font-black ${avgMood.text}`}>Weekly Avg Mood</p><p className="text-xs text-gray-400">{avgMood.label}</p></div>
          </div>
        ) : (
          <div className="bg-gray-50 border border-gray-200 px-4 py-2 rounded-xl text-xs text-gray-400 italic">No mood data yet</div>
        )}
      </div>

      {/* Stats row */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
        {[
          { val: Math.round((doneLessons/lessons.length)*100)+'%', label:'Lessons Done',    color:'text-brand-teal' },
          { val: entries.length,  label:'Total Entries',   color:'text-brand-pink' },
          { val: thisWeek.length, label:'This Week',       color:'text-brand-yellow' },
          { val: hwDone,          label:'HW Submitted',    color:'text-gray-600' },
        ].map(({val,label,color})=>(
          <div key={label} className="bg-gray-50 rounded-xl p-3">
            <div className={`text-2xl font-black ${color}`}>{val}</div>
            <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">{label}</div>
          </div>
        ))}
      </div>

      {/* Mood bar chart */}
      {moodCounts.length > 0 && (
        <div>
          <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Mood Distribution — This Week</p>
          <div className="space-y-2">
            {MOODS.map(m => {
              const mc = moodCounts.find(x=>x.val===m.val);
              if (!mc) return null;
              return (
                <div key={m.val} className="flex items-center gap-3">
                  <span className="text-lg w-7 flex-shrink-0">{m.emoji}</span>
                  <span className="text-xs font-semibold text-gray-600 w-20 flex-shrink-0">{m.label}</span>
                  <div className="flex-1 bg-gray-100 rounded-full h-2.5">
                    <div className={`${m.bar} h-2.5 rounded-full transition-all duration-500`} style={{width:`${(mc.count/moodEntries.length)*100}%`}}/>
                  </div>
                  <span className="text-xs text-gray-400 w-5 text-right flex-shrink-0">{mc.count}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Flagged entries */}
      {flagged.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-xl p-4 space-y-3">
          <p className="text-xs font-black text-red-600 uppercase tracking-wide">⚠ Needs Attention — {flaggedCount} entry{flaggedCount>1?'s':''} flagged{flaggedCount > 5 ? ' (5 most recent shown)' : ''}</p>

/* ── IMPACT COUNTER ─────────────────────────────────────────────────── */
const ImpactCounter = () => {
  const [stats, setStats] = React.useState(null);
  React.useEffect(() => {
    if (!FB_ENABLED) return;
    (async () => {
      const classrooms = await fbRead('sv_classrooms');
      if (!classrooms) return;
      let students = 0, moods = 0, journals = 0, lessons = 0;
      Object.values(classrooms).forEach(cls => {
        const studs = cls.students || {};
        Object.values(studs).forEach(s => {
          students++;
          moods += Array.isArray(s.moods) ? s.moods.length : Object.keys(s.moods||{}).length;
          journals += (Array.isArray(s.journal) ? s.journal : Object.values(s.journal||{})).filter(j => j.shared).length;
          lessons += Object.values(s.lessons||{}).filter(l => l.done).length;
        });
      });
      setStats({ students, moods, journals, lessons });
    })();
  }, []);
  const totalLessons = Object.values(allLessonPlans).filter(l => !l.placeholder).length;
  const items = [
    { val: totalLessons, label: 'Lessons in Curriculum', color: 'text-brand-teal', static: true },
    { val: stats ? stats.students : null, label: 'Students Enrolled', color: 'text-brand-pink' },
    { val: stats ? stats.moods : null, label: 'Mood Check-Ins', color: 'text-brand-yellow' },
    { val: stats ? stats.lessons : null, label: 'Lessons Completed', color: 'text-brand-teal' },
  ];
  return (
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
      {items.map(({ val, label, color, static: isStatic }) => (
        <div key={label} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center space-y-1">
          <div className={`text-3xl font-black ${color}`}>
            {val != null ? val : isStatic ? totalLessons : <span className="text-gray-200 animate-pulse">...</span>}
          </div>
          <div className="text-[10px] text-gray-400 uppercase font-bold tracking-wide leading-tight">{label}</div>
        </div>
      ))}
    </div>
  );
};

const AdminDashboard = () => {
  const exit = () => { window.location.hash = ''; };
  const [authed, setAuthed] = useState(() => { try { return sessionStorage.getItem('sv_admin_authed') === 'true'; } catch { return false; } });
  const [code, setCode] = useState('');
  const [err, setErr] = useState(false);
  const [checking, setChecking] = useState(false);

  const submit = async () => {
    const entered = code.trim();
    if (!entered) { setErr(true); return; }
    setChecking(true);
    const adminCode = await fbRead('sv_admin/adminCode');
    setChecking(false);
    if (typeof adminCode === 'string' && entered === adminCode.trim()) {
      try { sessionStorage.setItem('sv_admin_authed', 'true'); } catch {}
      setAuthed(true);
    } else { setErr(true); setCode(''); }
  };

  if (!authed) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#f0fafa 0%,#fff0f5 100%)'}}>
        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full space-y-6 fade-in">
          <div className="text-center">
            <TeacherIcon size={40} cls="text-brand-teal mx-auto mb-3"/>
            <h2 className="section-header">Admin Access</h2>
            <p className="text-gray-400 text-sm mt-1">Enter the administrator code to continue.</p>
          </div>
          <div className="space-y-3">
            <input type="password" value={code}
              onChange={e=>{setCode(e.target.value);setErr(false);}}
              onKeyDown={e=>e.key==='Enter'&&submit()}
              placeholder="Admin code..."
              className={`w-full p-3 border-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-100 transition ${err?'border-red-400':'border-gray-200 focus:border-brand-teal'}`}
              autoFocus/>
            {err&&<p className="text-xs text-red-500 font-medium">Incorrect code. Please try again.</p>}
            {!FB_ENABLED&&<p className="text-xs text-amber-600 font-medium">Database not configured — admin access is unavailable.</p>}
            <button onClick={submit} disabled={checking} className="w-full bg-brand-teal text-white py-3 rounded-xl font-bold hover:opacity-90 transition disabled:opacity-60">
              {checking ? 'Checking…' : 'Enter Admin Dashboard'}
            </button>
            <button onClick={exit} className="w-full text-gray-400 text-sm hover:text-gray-600 transition py-1">
              ← Back to app
            </button>
          </div>
        </div>
      </div>
    );
  }

  return <AdminPanel onExit={exit} />;
};

      const studs = await fbRead(`sv_classrooms/${cc}/students`);
      const studentCount = studs && typeof studs === 'object' ? Object.keys(studs).length : 0;
      return { code: cc, teacherName: (info && info.teacherName) || '—', createdAt: (info && info.createdAt) || '', studentCount };
    }));
    rows.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    setTeacherCodes(codes && typeof codes === 'object' ? codes : {});
    setClassrooms(rows);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const toggleActive = async (key) => {
    const cur = teacherCodes[key] || {};
    const next = { ...cur, active: cur.active === false ? true : false };
    setTeacherCodes({ ...teacherCodes, [key]: next });
    await fbWrite(`sv_admin/teacherCodes/${key}`, next);
  };

  const addCode = async () => {
    const c = newCode.trim().toUpperCase();
    if (!c) return;
    setAdding(true);
    const entry = { label: newLabel.trim(), active: true, createdAt: new Date().toISOString() };
    await fbWrite(`sv_admin/teacherCodes/${c}`, entry);
    setTeacherCodes(prev => ({ ...prev, [c]: entry }));
    setNewCode(''); setNewLabel('');
    setAdding(false);
  };

  const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); };

  const codeKeys = Object.keys(teacherCodes);
  const totalStudents = classrooms.reduce((n, c) => n + c.studentCount, 0);
  const stats = [
    { val: classrooms.length, label: 'Classrooms' },
    { val: codeKeys.length, label: 'Teacher Codes' },
    { val: totalStudents, label: 'Students' },
  ];

  return (
    <div className="min-h-screen bg-gray-50 pb-20">
      <header className="bg-white shadow-sm sticky top-0 z-20 border-b border-gray-200">
        <nav className="container mx-auto px-4 py-3 flex justify-between items-center">
          <div className="flex items-center gap-3">
            <span className="bg-brand-teal text-white rounded-lg w-9 h-9 flex items-center justify-center font-bold text-lg" style={{fontFamily:'Montserrat'}}>9</span>
            <h1 className="text-xl font-semibold text-gray-900" style={{fontFamily:'Montserrat'}}>Admin Dashboard</h1>
          </div>
          <button onClick={onExit} className="text-xs text-gray-400 hover:text-gray-600 border border-gray-200 rounded-lg px-3 py-1.5 transition hover:border-gray-300">Exit</button>
        </nav>
      </header>
      <main className="container mx-auto px-4 py-10 max-w-4xl space-y-8">
        {loading ? (
          <p className="text-center text-gray-400 text-sm py-10">Loading admin data…</p>
        ) : (
        <>
          {/* Stats row */}
          <div className="grid grid-cols-3 gap-4 text-center">
            {stats.map(s => (
              <div key={s.label} className="bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
                <div className="text-3xl font-black text-brand-teal">{s.val}</div>
                <div className="text-[11px] text-gray-400 uppercase font-bold mt-1 tracking-wide">{s.label}</div>
              </div>
            ))}
          </div>

          {/* Teacher Access Codes */}
          <section className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
            <h2 className="section-header">Teacher Access Codes</h2>
            <div className="space-y-2">
              {codeKeys.length === 0 && <p className="text-sm text-gray-400">No teacher codes yet.</p>}
              {codeKeys.map(k => {
                const c = teacherCodes[k] || {};
                const active = c.active !== false;
                return (
                  <div key={k} className="flex items-center justify-between gap-3 border border-gray-100 rounded-xl px-4 py-3 flex-wrap">
                    <div className="min-w-0">
                      <span className="font-bold text-gray-800 font-mono">{k}</span>
                      {c.label && <span className="text-sm text-gray-500 ml-2">{c.label}</span>}
                    </div>
                    <div className="flex items-center gap-3">
                      <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${active?'bg-brand-teal/10 text-brand-teal':'bg-gray-100 text-gray-400'}`}>{active?'Active':'Inactive'}</span>
                      <button onClick={() => toggleActive(k)} className="text-xs font-semibold text-brand-teal underline hover:opacity-70 transition">
                        {active ? 'Deactivate' : 'Activate'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="border-t border-gray-100 pt-4">
              <p className="text-xs font-bold uppercase text-gray-400 mb-2">Add Code</p>
              <div className="flex flex-wrap gap-2 items-center">
                <input value={newCode} onChange={e=>setNewCode(e.target.value)} placeholder="CODE"
                  className="flex-1 min-w-[120px] p-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-brand-teal transition font-mono uppercase"/>
                <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="Label (e.g. Spring Cohort)"
                  className="flex-1 min-w-[160px] p-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-brand-teal transition"/>
                <button onClick={addCode} disabled={adding || !newCode.trim()} className="bg-brand-teal text-white px-4 py-2.5 rounded-xl font-bold hover:opacity-90 transition disabled:opacity-50">
                  {adding ? 'Adding…' : 'Add'}
                </button>
              </div>
            </div>
          </section>

          {/* Classrooms */}
          <section className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
            <h2 className="section-header">Classrooms</h2>
            {classrooms.length === 0 && <p className="text-sm text-gray-400">No classrooms yet.</p>}
            <div className="space-y-2">
              {classrooms.map(c => (
                <div key={c.code} className="flex items-center justify-between gap-3 border border-gray-100 rounded-xl px-4 py-3 flex-wrap">
                  <div className="min-w-0">
                    <span className="font-bold text-gray-800 font-mono">{c.code}</span>
                    <span className="text-sm text-gray-500 ml-2">{c.teacherName}</span>
                    <span className="text-xs text-gray-400 ml-2">Created {fmtDate(c.createdAt)}</span>
                  </div>
                  <span className="text-[11px] font-bold uppercase px-2 py-0.5 rounded-full bg-brand-pink/10 text-brand-pink">{c.studentCount} {c.studentCount === 1 ? 'student' : 'students'}</span>
                </div>
              ))}
            </div>
          </section>
        </>
        )}
      </main>
    </div>
  );
};

function App() {
  const [role, setRole] = useLS('hub_role', null);
  const [loginStep, setLoginStep] = useState(null);
  const [page, setPage] = useState('Home');
  const [subPage, setSubPage] = useState(null);
  const [showEnrollment, setShowEnrollment] = useState(false);
  const [showSupport, setShowSupport] = useState(false);
  const [hash, setHash] = useState(() => { try { return window.location.hash; } catch { return ''; } });

  useEffect(() => {
    const onHash = () => setHash(window.location.hash);
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Hidden admin surface — reachable only via #admin, never linked from nav.
  if (hash === '#admin') return <AdminDashboard/>;

  // Role gate
  if (!role) {
    if (loginStep === 'teacher') {
      return <TeacherLogin
        onSuccess={() => { setRole('teacher'); setLoginStep(null); }}
        onBack={() => setLoginStep(null)}/>;
    }
    return <RoleSelect onSelect={(r) => {
      if (r === 'student') {
        setRole('student');
        if (!getClassCode()) {
          setShowEnrollment(true);
        }
      } else if (r === 'homeschool') {
        setRole('homeschool');
      } else {
        setLoginStep('teacher');
      }
    }}/>;
  }

  // Show enrollment screen for new students
  if (showEnrollment && role === 'student') {
    return <StudentEnrollment onDone={() => setShowEnrollment(false)} />;
  }

  const switchRole = () => { setRole(null); setPage('Home'); setSubPage(null); };

  const navigate = (p) => {
    if (p.includes('/')) {
      const [main,sub] = p.split('/');
      setPage(main); setSubPage(sub);
    } else {
      setPage(p); setSubPage(null);
    }
    window.scrollTo(0,0);
  };

  const teacherPreviewBar = role === 'teacher' ? (
    <div className="no-print mb-4 flex items-center gap-3 bg-brand-teal/10 border border-brand-teal/30 text-brand-teal px-5 py-2.5 rounded-xl text-sm font-semibold">
      <TeacherIcon size={16}/> Previewing Student Experience
      <button onClick={() => navigate('TeacherHub')} className="ml-auto underline text-xs hover:opacity-70">Back to Teacher Hub</button>
    </div>
  ) : null;

  const toolWrap = (el) => (
    <div>
      <BackNav onClick={() => setSubPage(null)}/>
      {teacherPreviewBar}
      {el}
    </div>
  );

  const renderContent = () => {
    if (page === 'StudentHub') {
      const teacherPreviewBanner = role === 'teacher' ? (
        <div className="no-print mb-6 flex items-center gap-3 bg-brand-teal/10 border border-brand-teal/30 text-brand-teal px-5 py-3 rounded-xl text-sm font-semibold max-w-6xl mx-auto">
          <TeacherIcon size={18}/> You are previewing the Student Experience
          <button onClick={() => navigate('TeacherHub')} className="ml-auto underline text-xs hover:opacity-70">Back to Teacher Hub</button>
        </div>
      ) : null;
      if (!subPage) {
        const journalEntries = (() => { try { return JSON.parse(localStorage.getItem('journal'))||[]; } catch { return []; } })();
        const studentJournalCount = journalEntries.length;
        const studentLessonsDone = (() => {
          try {
            return Object.values(allLessonPlans).filter(l => !l.placeholder && JSON.parse(localStorage.getItem(`lesson_done_${l.title.replace(/\s+/g,'_')}`))).length;
          } catch { return 0; }
        })();
        const totalLessons = Object.values(allLessonPlans).filter(l => !l.placeholder).length;
        const moodStreak = getMoodStreak(journalEntries);
        return (
        <div className="max-w-6xl mx-auto space-y-10">
          {teacherPreviewBanner}
          <div className="text-center">
            <h1 className="page-title">Student Dashboard</h1>
            <p className="page-subtitle mt-2">Your complete survival toolkit for 9th grade.</p>
          </div>
          {/* Quick stats */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center max-w-2xl mx-auto">
            <div className="bg-white rounded-xl border p-3">
              <div className="text-2xl font-black text-brand-teal">{studentLessonsDone}</div>
              <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Lessons Done</div>
            </div>
            <div className="bg-white rounded-xl border p-3">
              <div className="text-2xl font-black text-brand-pink">{studentJournalCount}</div>
              <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Journal Entries</div>
            </div>
            <div className="bg-white rounded-xl border p-3">
              <div className="text-2xl font-black text-gray-300">{totalLessons - studentLessonsDone}</div>
              <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Remaining</div>
            </div>
            <div className={`rounded-xl border p-3 ${moodStreak > 0 ? 'bg-orange-50 border-orange-200' : 'bg-white'}`}>
              <div className={`text-2xl font-black ${moodStreak > 0 ? 'text-orange-500' : 'text-gray-300'}`}>
                {moodStreak > 0 ? `🔥${moodStreak}` : '—'}
              </div>
              <div className="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Day Streak</div>
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <ToolCard title="Task Planner" icon={CheckCircle} desc="Track your daily and weekly priorities." onClick={() => navigate('StudentHub/TaskPlanner')}/>
            <ToolCard title="Grade Tracker" icon={StarIcon} desc="Log your grades and see your GPA." onClick={() => navigate('StudentHub/GradeTracker')}/>
            <ToolCard title="Habit Tracker" icon={BrainIcon} desc="Build the habits that change your GPA." onClick={() => navigate('StudentHub/HabitTracker')}/>
            <ToolCard title="Project Chunker" icon={ArrowRight} desc="Break big projects into manageable steps." onClick={() => navigate('StudentHub/Chunker')}/>
            <ToolCard title="Journal & AI Log" icon={BookOpen} desc="Reflect, download, and track your thinking." badge={studentJournalCount > 0 ? studentJournalCount : null} onClick={() => navigate('StudentHub/Journal')}/>
            <ToolCard title="Lesson Library" icon={HandoutIcon} desc={`${studentLessonsDone} of ${totalLessons} lessons complete.`} badge={studentLessonsDone > 0 ? `${studentLessonsDone}✓` : null} onClick={() => navigate('StudentHub/Lessons')}/>
          </div>
          <div className="flex flex-wrap justify-center gap-3 no-print">
            <button onClick={() => navigate('StudentHub/OnePager')} className="inline-flex items-center gap-2 bg-white border border-gray-200 text-brand-teal font-semibold px-5 py-2.5 rounded-xl hover:shadow-md hover:border-brand-teal transition text-sm">
              🖨 Print Student &amp; Parent One-Pager
            </button>
            <button onClick={() => navigate('Privacy')} className="inline-flex items-center gap-2 bg-white border border-gray-200 text-gray-500 font-semibold px-5 py-2.5 rounded-xl hover:shadow-md hover:border-gray-400 transition text-sm">
              🔒 Who Sees What
            </button>
          </div>
          {showSupport && (
            <div className="max-w-md mx-auto">
              <CrisisSupportCard onDismiss={() => setShowSupport(false)} />
            </div>
          )}
          <div className="text-center no-print">
            <button onClick={() => setShowSupport(s => !s)} className="text-sm text-purple-500 hover:text-purple-700 underline transition">
              Need support?
            </button>
          </div>
        </div>
        );
      }

      if (subPage === 'OnePager') return (
        <div className="max-w-3xl mx-auto space-y-6">
          <BackNav onClick={() => setSubPage(null)} label="Back to Student Hub"/>
          {teacherPreviewBar}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <h1 className="page-title">Student &amp; Parent One-Pager</h1>
            <PrintBtn onClick={() => window.print()}>Print One-Pager</PrintBtn>
          </div>
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 print-card">
            <div className="md-content" dangerouslySetInnerHTML={{__html: renderMarkdown(teacherSections.find(s=>s.id==='OnePager')?.content||'')}}/>
          </div>
        </div>
      );

      if (subPage === 'Lessons') return (
        <div className="max-w-6xl mx-auto space-y-12">
          <BackNav onClick={() => setSubPage(null)} label="Back to Student Hub"/>
          {teacherPreviewBar}
          <div>
            <h1 className="page-title">Student Digital Library</h1>
            <p className="page-subtitle mt-2">The ultimate field guide to thriving in high school.</p>
          </div>
          {[
            {name:'Foundations of Success', keys:['intro','ch1','ch10'], desc:'Getting started, mindsets, and decoding your classes.'},
            {name:'Executive Functioning', keys:['ch2','ch3','ch4','ch5'], desc:'Time management, project chunking, note-taking systems, and study strategies that actually work.'},
            {name:'Academic Mastery', keys:['ch6','ch7'], desc:'Communication and collaboration skills.'},
            {name:'Social & Personal Skills', keys:['ch8','ch9'], desc:'Taking care of you and navigating digital life.'},
            {name:'Future Ready', keys:['ch11','ch12','conclusion'], desc:'Financial literacy, AI co-pilots, and finishing strong.'},
            {name:'Michigan College & Career Track', keys:['mich1','mich2','mich3','mich4','mich5','mich6','mich7','mich8'], desc:'Credits, credit recovery, dual enrollment, CLEP, ACT/SAT, college selection, CTE, and specialty schools — Detroit and Michigan first.'}
          ].map(cat => (
            <section key={cat.name} className="space-y-4">
              <div className="border-b-2 border-yellow-200 pb-2">
                <h2 className="section-header" style={{fontSize:'1.4rem'}}>● {cat.name}</h2>
                <p className="text-gray-500 text-sm mt-0.5">{cat.desc}</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {cat.keys.map(k => {
                  const l = allLessonPlans[k];
                  if (!l || l.placeholder) return (
                    <div key={k} className="p-6 bg-gray-50 border border-dashed border-gray-200 rounded-xl opacity-60 flex flex-col gap-2">
                      <span className="text-xs text-gray-400 font-bold uppercase">{k}</span>
                      <p className="font-semibold text-gray-500" style={{fontFamily:'Montserrat'}}>{l ? l.title : k}</p>
                      <span className="text-xs text-gray-400 italic mt-auto">Coming soon</span>
                    </div>
                  );
                  const lessonDone = (() => { try { return JSON.parse(localStorage.getItem(`lesson_done_${l.title.replace(/\s+/g,'_')}`)); } catch { return false; } })();
                  return (
                    <button key={k} onClick={() => navigate(`StudentHub/LDetail_${k}`)}
                      className="p-6 bg-white border border-gray-200 rounded-xl text-left hover:border-brand-pink hover:shadow-md transition group relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-1 h-full bg-brand-pink opacity-0 group-hover:opacity-100 transition"/>
                      {lessonDone && <span className="absolute top-3 right-3 text-brand-teal text-xs font-bold">⭐ Done</span>}
                      <h3 className="font-bold text-gray-900 group-hover:text-brand-pink transition" style={{fontFamily:'Montserrat'}}>{l.title}</h3>
                      <p className="text-sm text-gray-500 mt-2">{l.topic}</p>
                    </button>
                  );
                })}
              </div>
            </section>
          ))}
        </div>
      );

      if (subPage&&subPage.startsWith('LDetail_')) {
        const k = subPage.replace('LDetail_','');
        return <div><BackNav onClick={() => setSubPage('Lessons')} label="Back to Lesson Library"/>{teacherPreviewBar}<LessonViewer lesson={allLessonPlans[k]} isStudent={true}/></div>;
      }

      if (subPage==='TaskPlanner') return toolWrap(<TaskPlanner/>);
      if (subPage==='GradeTracker') return toolWrap(<GradeTracker/>);
      if (subPage==='HabitTracker') return toolWrap(<HabitTracker/>);
      if (subPage==='Chunker') return toolWrap(<ProjectChunker/>);
      if (subPage==='Journal') return toolWrap(<JournalPrompts isTeacher={role==='teacher'}/>);
      return null;
    }

    if (page === 'TeacherHub') return <TeacherHub navigate={navigate} subPage={subPage}/>;

    if (role === 'homeschool' && page === 'Home') return <HomeschoolHub navigate={navigate} switchRole={switchRole}/>;

    if (page === 'HandoutLibrary') return (
      <div className="max-w-4xl mx-auto space-y-10">
        <div className="flex justify-between items-center flex-wrap gap-4">
          <div>
            <h1 className="page-title">Handout Library</h1>
            <p className="text-gray-600 mt-2">Toggle "Interactive" on any handout to fill it out digitally.</p>
          </div>
          <PrintBtn onClick={() => { alert("Printing all materials... Use your browser's print dialog to save as PDF."); window.print(); }}>Print All</PrintBtn>
        </div>
        {Object.entries(handoutContent).map(([k,h]) => <HandoutCard key={k} handoutKey={k} title={h.title} content={h.content}/>)}
      </div>
    );

    if (page === 'Contact') return <ContactPage/>;
    if (page === 'About') return <FounderBioPage/>;
    if (page === 'Privacy') return <PrivacyPage onBack={() => navigate('StudentHub')}/>;

    return <Home navigate={navigate} role={role}/>;
  };

  return (
    <div className="min-h-screen bg-gray-50 pb-20">
      <Header page={page} navigate={navigate} role={role} onSwitchRole={switchRole}/>
      <main className="container mx-auto px-4 py-10">
        <div key={page+(subPage||'')} className="fade-in">
          {renderContent()}
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

/*
 * ── ROADMAP (future sessions) ──────────────────────────────────────────
 *
 * MORNING EMAIL DIGEST
 *   Daily summary email to teacher: flagged students, class avg mood,
 *   new check-ins since last digest. Needs a serverless function (Netlify
 *   Functions + SendGrid). Firebase Cloud Messaging is an alternative.
 *
 * GOOGLE CLASSROOM IMPORT
 *   Let teachers paste a Google Classroom roster CSV or OAuth import to
 *   pre-populate student names instead of waiting for self-enrollment.
 *   Store at sv_classrooms/{code}/rosterImport.
 *
 * SPANISH / ARABIC LOCALIZATION
 *   Add i18n strings object keyed by locale ('en', 'es', 'ar').
 *   Auto-detect browser language; let students override in settings.
 *   RTL layout support needed for Arabic (dir="rtl" on root element).
 *
 * PARENT / GUARDIAN VIEW
 *   Read-only view scoped to one student (authenticated by student PIN
 *   plus a separate parent code). Shows lesson progress and aggregate
 *   mood trend only — never raw journal text. Path: sv_classrooms/{code}/
 *   students/{id}/parentCode.
 * ───────────────────────────────────────────────────────────────────── */
</script>
</body>
</html>
