const FIREBASE_DB_URL = 'https://scholars-vanguard-default-rtdb.firebaseio.com';
const FB_ENABLED = typeof FIREBASE_DB_URL === 'string' && FIREBASE_DB_URL !== 'YOUR_FIREBASE_DATABASE_URL' && FIREBASE_DB_URL.startsWith('https://');

const fbPath = (path) => `${FIREBASE_DB_URL}/${path}.json`;

const fbRead = async (path) => {
  if (!FB_ENABLED) return null;
  try {
    const r = await fetch(fbPath(path));
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
};

const fbWrite = async (path, data) => {
  if (!FB_ENABLED) return;
  try {
    await fetch(fbPath(path), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  } catch {}
};

const fbPatch = async (path, data) => {
  if (!FB_ENABLED) return;
  try {
    await fetch(fbPath(path), { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
  } catch {}
};

// Generate a unique student ID (stored in localStorage)
const getStudentId = () => {
  let id = localStorage.getItem('sv_student_id');
  if (!id) {
    id = 'stu_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem('sv_student_id', id);
  }
  return id;
};

// Generate a 6-char class code

// Safe key for Firebase (no special chars)
const safeKey = (s) => s.replace(/[.#$\/\[\]]/g, '_');

// Read the class code from localStorage. useLS stores values JSON-encoded
// (with quotes), so a raw getItem returns '"ABC123"' and corrupts Firebase paths.
const getClassCode = () => {
  try {
    const v = localStorage.getItem('sv_class_code');
    if (!v) return null;
    const parsed = v.startsWith('"') ? JSON.parse(v) : v;
    return parsed || null;
  } catch { return null; }
};

// Hash a 4-digit PIN with SHA-256 (browser crypto, no PII stored)
const hashPin = async (pin) => {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sv_pin_v1_' + pin));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch { return null; }
};

// Consecutive-day streak from a list of journal entries
const getMoodStreak = (entries) => {
  const days = [...new Set((entries||[]).map(e => (e.date||'').slice(0,10)).filter(Boolean))].sort().reverse();
  if (!days.length) return 0;
  const pad = (d) => d.toISOString().slice(0,10);
  const today = pad(new Date());
  const yesterday = pad(new Date(Date.now() - 86400000));
  if (days[0] !== today && days[0] !== yesterday) return 0;
  let streak = 0, cursor = days[0];
  for (const d of days) {
    if (d === cursor) {
      streak++;
      cursor = pad(new Date(new Date(cursor+'T12:00:00Z').getTime() - 86400000));
    } else break;
  }
  return streak;
};

// Phrases that trigger a red language alert in the teacher roster
const LANGUAGE_ALERT_PHRASES = [
  "tired of everything","nothing i do","want to disappear","nobody cares",
  "can't do this anymore","give up","no point","end it","hurt myself",
  "not worth it","hate myself","what's the point","don't want to be here",
  "nobody would notice","wish i wasn't","i give up","done with everything",
  "no one cares","i quit","don't care anymore","nothing matters"
];

// Returns 'red' (language alert), 'yellow' (mood watch), or null
const getMoodTier = (moods, journal) => {
  const allMoods = Array.isArray(moods) ? moods : Object.values(moods || {});
  const allJournal = Array.isArray(journal) ? journal : Object.values(journal || {});
  const sharedEntries = allJournal.filter(j => j.shared);
  const matchesPhrases = (str) => {
    const s = (str || '').toLowerCase();
    return s.length > 0 && LANGUAGE_ALERT_PHRASES.some(p => s.includes(p));
  };
  const hasLanguageAlert =
    allMoods.some(m => m.flagged === true) ||
    allMoods.some(m => matchesPhrases(m.note)) ||
    sharedEntries.some(j => matchesPhrases(j.text));
  if (hasLanguageAlert) return 'red';
  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const recentLow = allMoods.filter(m => {
    const d = new Date(m.date || 0);
    return d >= sevenDaysAgo && m.mood != null && m.mood <= 2;
  });
  if (recentLow.length >= 3) return 'yellow';
  return null;
};

const detectMood = (text) => {
  if (!text || text.trim().length < 30) return null;
  const t = text.toLowerCase();
  const neg = ['hard','difficult',"don't",'confused','lost','hate','sad','tired','scared','overwhelm','stress',"can't",'cannot','struggle','behind','fail','rough','bad','frustrated','anxious','worried','upset','stuck','hopeless','behind'];
  const pos = ['great','love','excit','understood','got it','amazing','happy','proud','confident','finally','awesome','better','good','helped','clear','click','makes sense','i get it','starting to'];
  const nc = neg.filter(w => t.includes(w)).length;
  const pc = pos.filter(w => t.includes(w)).length;
  if (nc >= 3 || (nc >= 2 && nc > pc)) return 1;
  if (nc >= 1 && pc === 0) return 2;
  if (pc >= 3 || (pc >= 2 && pc > nc)) return 5;
  if (pc >= 1 && nc === 0) return 4;
  return 3;
};

/* ── LOCAL STORAGE HOOK ──────────────────────────────────────────────── */
function useLS(key, def) {
  const [s, setS] = useState(() => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch { return def; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(s)); } catch {}
  }, [key, s]);
  return [s, setS];
}

  mon.setDate(today.getDate() - (dow===0?6:dow-1));
  return Array.from({length:7}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
};

const getStreak = (days) => { let s=0; for(let i=days.length-1;i>=0;i--){ if(days[i])s++; else break; } return s; };

const renderMarkdown = (text) => {
  if (!text) return '';
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  const renderTable = (rows) => {
    if (rows.length < 2) return rows.map(r=>`<p class="md-p">${inline(r)}</p>`).join('');
    const headers = rows[0].split('|').filter(c=>c.trim()).map(c=>c.trim());
    const dataRows = rows.slice(2).filter(r=>r.trim()&&r.trim()!=='|');
    let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
    headers.forEach(h => { html += `<th class="md-th">${inline(h)}</th>`; });
    html += '</tr></thead><tbody>';
    dataRows.forEach(row => {
      const cells = row.split('|').filter(c=>c.trim()).map(c=>c.trim());
      html += '<tr>';
      cells.forEach(c => { html += `<td class="md-td">${inline(c)}</td>`; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  };
  const lines = text.split('\n');
  const out = []; let listItems = []; let tableBuffer = []; let inTable = false;
  const flushList = () => { if(listItems.length){ out.push('<ul class="md-ul">'+listItems.map(li=>`<li class="md-li">${li}</li>`).join('')+'</ul>'); listItems=[]; } };
  const flushTable = () => { if(tableBuffer.length){ out.push(renderTable(tableBuffer)); tableBuffer=[]; inTable=false; } };
  for (const line of lines) {
    const isTR = line.trim().startsWith('|')&&line.includes('|');
    const isSep = /^\|[-: |]+\|$/.test(line.trim());
    if (isTR) { if(!inTable){flushList();inTable=true;} tableBuffer.push(line); continue; }
    if (inTable) flushTable();
    if (line.startsWith('### ')){ flushList(); out.push(`<h3 class="md-h3">${inline(line.slice(4))}</h3>`); }
    else if (line.startsWith('## ')){ flushList(); out.push(`<h2 class="md-h2">${inline(line.slice(3))}</h2>`); }
    else if (line.startsWith('# ')){ flushList(); out.push(`<h1 class="md-h1">${inline(line.slice(2))}</h1>`); }
    else if (/^[-*]\s/.test(line)) listItems.push(inline(line.slice(2)));
    else if (/^\d+\.\s/.test(line)) listItems.push(inline(line.replace(/^\d+\.\s/,'')));
    else if (/^---+$/.test(line.trim())){ flushList(); out.push('<hr class="md-hr"/>'); }
    else if (line.trim()==='') { flushList(); out.push('<div class="md-gap"></div>'); }
    else { flushList(); out.push(`<p class="md-p">${inline(line)}</p>`); }
  }
  flushList(); if(inTable) flushTable();
  return out.join('\n');
};

const teacherSections = [
  { id: 'Overview', label: 'Curriculum Overview', desc: 'Mission, philosophy, and core pillars.', content: `## About This Curriculum
*Developed by Scholar Vanguard. All frameworks, structures, and original content are the intellectual property of Scholar Vanguard and may not be reproduced or distributed without written permission.*

---

## The Problem This Curriculum Solves

Every year, thousands of students enter high school with strong potential and leave feeling like they failed. They were not failing because they were not smart. They were failing because no one taught them how high school actually works.

Schools teach content. They teach algebra, biology, and essay structure. What they almost never teach explicitly is the layer underneath all of that: how to manage your time when you have seven teachers and no one keeping track of you, how to break a six-week project into steps before the night before it is due, how to walk into a teacher's office and advocate for yourself without falling apart, and how to use the AI tools now embedded in every classroom without letting those tools do your thinking for you.

This curriculum exists to teach that layer. Explicitly. Intentionally. With the same rigor we give to academic content.

---

## Mission

To move students from surviving high school to thriving in it by teaching the executive functioning, social-emotional, and AI implementation skills that schools assume students already have but rarely teach.

---

## Who This Is For

This curriculum was designed for 9th graders navigating their first year of high school, but its skills are relevant to any student who has ever felt overwhelmed, behind, or like everyone else figured out something they missed. It is particularly powerful for students who have experienced disruption, who are first-generation high school completers, or who have never had someone explicitly teach them how to work a system that was not built with them in mind.

It is also for teachers who are tired of re-teaching the same organizational and behavioral skills semester after semester because no one has given students a dedicated space to build them.

---

## The Three Pillars

### Pillar 1: Executive Functioning
Time management, project planning, note-taking systems, and study strategies. Most students who struggle academically are not lacking intelligence. They are lacking the organizational infrastructure that high-achieving students often receive at home, through tutoring, or through prior educational advantage. This curriculum makes that infrastructure explicit and accessible to every student in the room.

**What students build:** A personal planner system that actually works for their brain, the ability to deconstruct any large assignment into manageable steps, and a note-taking method they chose because it fits how they think — not because a teacher told them to use it.

### Pillar 2: Social-Emotional Learning
Self-awareness, peer relationships, teacher communication, wellness, and resilience. High school is not just an academic environment. It is a social one, and the social pressures of 9th grade are real, constant, and often more overwhelming than any class. Students need more than a poster about feelings. They need actual tools and practiced language for navigating conflict, asking for help, setting limits with peers, and taking care of their mental and physical health when no one is requiring them to.

**What students build:** The language and confidence to advocate for themselves with adults, a personal wellness toolkit they can actually use under pressure, and a clearer sense of who they are and what they value.

### Pillar 3: AI Implementation Literacy (The P.I.L.O.T. Framework)
Students do not need another lecture about whether AI is good or bad. They need to know how to use it — and how not to let it use them. This curriculum introduces the **Scholar Vanguard P.I.L.O.T. Framework**, a proprietary five-step AI implementation process designed to work inside any school AI ecosystem, whether students have access to Microsoft Copilot, Google Gemini, ChatGPT, or any future tool their district adopts.

The P.I.L.O.T. Framework positions the student as the decision-maker and the AI as the tool. It is not about digital citizenship or screen time. It is about teaching students to be critical, strategic, skilled operators of AI in every academic and professional context they will ever encounter.

**What students build:** A transferable process for using any AI tool without surrendering their thinking to it, the ability to write precise prompts and critically evaluate responses, and the habit of transformation: rewriting AI output in their own voice and understanding.

---

## What Makes This Curriculum Different

Most advisory and SEL curricula fail for one of two reasons. Either they are so broad and feel-good that teachers cannot measure anything and students retain nothing, or they are so content-heavy that they become another class students tune out. This curriculum is neither.

Every lesson in this curriculum is:

**Immediately applicable.** Students use what they learn the same day. There is no "we will use this later." Time management tools go into their planner that afternoon. Note-taking methods are tested in their next class.

**Trauma-informed by design.** Every lesson opens with co-regulation before instruction. Students are never ambushed by content. Choice is built into every activity. Reflection is private before it is ever public. Nothing is graded on whether the answer is "right."

**Skill-spiral structured.** Skills introduced in Chapter 1 reappear in Chapter 6, 9, and 12 in new contexts. Students do not learn a skill once and move on. They practice it repeatedly until it becomes a habit.

**Voice-centered.** Students are the authority on their own experience in this classroom. Their strategies, reflections, and decisions drive the work. The teacher facilitates. The student leads.

---

## Design Principles

- Students learn best when they feel safe enough to be honest. Safety is always built before content is delivered.
- Skills are only real when students can use them without being told to. Every lesson aims for automaticity, not compliance.
- No student enters this classroom behind. They enter with different experiences. That is the starting point.
- Reflection is the engine of this curriculum. If a student does not have time to think about what they learned, they did not learn it.
- This curriculum is explicitly not neutral. It names the systems students are navigating and gives them tools to move through those systems with agency and intention.

---

## Expected Student Outcomes

By the end of this course, a student should be able to:

- Plan and manage a full academic week without adult intervention
- Break any large project into steps and execute them on a timeline they created
- Use at least two note-taking methods and know which one fits their learning style
- Walk into a difficult conversation with a teacher and advocate for themselves clearly
- Apply the Scholar Vanguard P.I.L.O.T. Framework to any AI interaction in any school environment
- Identify their own stress signals and use at least three personal wellness strategies
- Name what they value, what they are building toward, and why high school is a step toward it` },

  { id: 'Strategies', label: 'Instructional Strategies', desc: 'Best practices for delivering the curriculum.', content: `## Core Delivery Principles

This curriculum is built on one foundational belief: students cannot absorb skill instruction when they are dysregulated, disengaged, or defensive. Every strategy in this guide is designed to lower that barrier first, then deliver the content.

---

## Strategy 1: Lower the Affective Filter Before Every Lesson

Students cannot learn when they feel unsafe, embarrassed, or overwhelmed. This is not a philosophy — it is neuroscience. The brain under stress routes energy away from the prefrontal cortex (where learning happens) and toward the survival response. Your first job in every class is to make the room feel safe enough to try.

**How to do it:**
- Open every lesson with a low-stakes, no-wrong-answer check-in question. Post it as students walk in.
- Use anonymous submission for any topic that might surface vulnerability (sticky notes, a shared anonymous doc, index cards slid under the door).
- Never cold-call students on sensitive reflection prompts. Always give a private write-first option.
- When the room feels tense, name it: "I can feel we need a moment. Let's take one."

**Scripts that work:**
- "Before we start, on a scale of 1 to 5, where is your energy right now? Hold up fingers. No explanation needed."
- "Write down one word that describes how you are walking into today. You do not have to share it."

---

## Strategy 2: Model Everything Before You Expect It

Never assign a strategy you have not demonstrated out loud in front of students. Telling students to "use the Cornell method" without showing your own notes is like telling someone to swim without letting them watch first.

**How to model:**
- Think aloud as you work. Say what you are deciding, not just what you are doing. "I am looking at this project and thinking — what is the first thing I can actually do today? I am going to write that down here."
- Make a visible mistake during modeling and fix it in real time. Students need to see that the process is messy before it is clean.
- Keep your model visible in the room for reference after the lesson (on the board, a posted anchor chart, or a shared doc).

---

## Strategy 3: Think-Pair-Share as the Default Structure

Independent think time, followed by partner discussion, followed by optional whole-class share. This structure dramatically increases participation, reduces the anxiety of being put on the spot, and gives quieter students a chance to rehearse their thinking before going public with it.

**Important:** The independent think time is not optional. Students who skip it and jump straight to talking will borrow their partner's thinking instead of developing their own. Require at least 60 to 90 seconds of silent writing before any partner conversation begins.

---

## Strategy 4: Offer Choice at Every Possible Moment

Choice is not chaos. It is safety. When students feel they have some agency over how they engage with content, their resistance drops significantly. The goal is not a free-for-all — it is giving students two or three structured options for how to demonstrate understanding.

**Choice examples:**
- "You can complete the reflection in writing or sketch your response as a diagram."
- "Choose the note-taking method from today's lesson that makes the most sense for how you think."
- "You can share with the class, share with your partner only, or keep this one private."

---

## Strategy 5: Scaffold Before You Assess

Never ask students to produce work they have not been shown how to produce. Every written reflection should have a sentence starter available. Every complex task should have a visible example. Every new strategy should have an anchor chart posted before students attempt it independently.

**Essential scaffolding tools:**
- Sentence starters for all written responses (post on the board for every exit ticket)
- Visual anchor charts for every strategy — use them repeatedly so students internalize them
- Graphic organizers for complex tasks like project chunking and study planning
- Chunked instructions: never give more than three steps at a time before checking for understanding

---

## Strategy 6: Questioning Without Putting Students on the Spot

The traditional "raise your hand if you know" creates a classroom where the same students answer every question and everyone else disengages. Replace it with structures that invite broader participation without the pressure.

**Alternatives to cold calling:**
- **Whip-around:** Everyone completes the same sentence stem, and you go around the room. No one is singled out.
- **Write then share:** Students write their answer before anyone speaks. Then volunteers share, but the thinking is already done.
- **Anonymous share:** Collect written responses and read them aloud without attribution. The room hears the range without anyone being exposed.
- **Partner share first:** Students tell their partner before they tell the class. Sharing with the whole room after feels less vulnerable.

---

## Strategy 7: Managing Difficult Moments

Some lessons in this curriculum will surface real emotion — financial stress, family instability, social conflict, mental health. This is not a problem. It is the curriculum working. Students who feel safe enough to surface real things are the ones who can learn real skills.

**When a student shares something heavy:**
1. Pause the lesson. The content can wait.
2. Acknowledge what they said without minimizing: "That is real. Thank you for trusting us with that."
3. Do not probe or ask follow-up questions that require more exposure.
4. After class, follow up privately. Know your mandatory reporting obligations.
5. Always have a referral path ready: counselor name, office location, how to make a same-day referral.

**When the room gets heated or unsafe:**
- Name what you observe without assigning blame: "The energy in the room is feeling heavy right now. Let's pause."
- Give students a physical reset: stand, stretch, take three breaths together.
- Redirect to the task without punishing the emotion that surfaced.

---

## Pacing and Flow

- Build in a 3 to 5 minute movement break in any lesson longer than 30 minutes.
- Use a visible countdown timer for all timed activities. Students regulate better when they can see the time.
- Always protect the last 5 minutes for the exit ticket. Do not skip it. It is your only formative data from the day.
- If student energy is low, spend more time on the Hook. An underpowered Hook produces an underpowered lesson.
- If you run short on time, cut from the middle of the activity — not from the debrief or exit ticket.

---

## Core Instructional Strategies

These five strategies are the non-negotiables of this curriculum. Apply them across every lesson regardless of topic.

**1. Name the Skill First**
Before students do anything, tell them exactly what skill they are building and why it matters outside this class. "Today you are learning to break a large project into steps. This is the same skill a surgeon uses before an operation and an engineer uses before building a bridge. Here is how it works." Students who know why they are learning something engage differently than students who are just following instructions.

**2. Think Aloud Consistently**
Your internal process is invisible to students. Make it visible. When you model a skill, narrate your own thinking in real time: "My first instinct here is to jump to the end — but that is the wrong move because I do not know what resources I actually have yet. So instead I am going to..." Students who hear expert thinking learn to replicate it. Students who only see the finished product cannot figure out the middle.

**3. Structured Turn and Talk — Not Open Discussion**
Unstructured discussion consistently privileges students who are already confident. Use structured pairs: one speaker, one active listener, then switch. Give a 30-second individual think time before any verbal response is expected. Use sentence starters written on the board for students who need the on-ramp: "One thing I noticed was... / I used to think... but now I think... / The part I am still unsure about is..."

**4. Low-Stakes Repetition Before High-Stakes Application**
Students need to try a skill with no consequences before they can be assessed on it. Every new strategy in this curriculum should be practiced first in a setting where wrong is fine and fast. Use games, competitions, pair challenges, or ungraded exit tickets to build fluency before expectation.

**5. The 24-Hour Feedback Rule**
When a student completes a reflection or submits a written response, give at least one piece of specific, non-generic feedback within 24 hours. Not "good job" — something that tells them you actually read it: "The part where you said you realized the 15-minute rule would help you in math — tell me more about that next time." Students who believe their teacher is actually reading their work write more honestly. Students who feel they are writing for no one stop writing for anyone.` },

  { id: 'Guide', label: "Teacher's Guide", desc: 'Full course overview and instructional philosophy.', content: `## Course at a Glance

| Detail | Info |
| :--- | :--- |
| Course Name | 9th Grader's Unofficial Survival Guide |
| Developer | Scholar Vanguard |
| Duration | Full school year or semester |
| Session Length | 50 minutes |
| Frequency | 1 to 3 times per week depending on school schedule |
| Assessment Model | Portfolio-based, Pass/Fail or Standards-Based |
| Grading Philosophy | Growth and reflection over correct answers |
| Materials | Student planner, journal (physical or digital), device (optional) |
| Prerequisites | None |
| Grade Level | 9th grade primary; adaptable for 10th grade |

---

## Core Philosophy

This course operates on one foundational belief: the skills that predict success in high school are teachable. Executive functioning, self-advocacy, and critical thinking are not personality traits. They are learnable, practiceable skills that students develop with explicit instruction and repeated opportunity — the same way they learn to write an essay or solve an equation.

What makes this curriculum different is what it refuses to do. It refuses to assume that students already know how to manage their time, break apart a large assignment, communicate with a teacher under stress, or use AI without outsourcing their thinking. Those assumptions are what fail students — particularly students who do not have adults at home who model those systems or have the bandwidth to teach them.

This is not a study hall. It is not a free period. It is not advisory with no accountability. It is a course with clear skill objectives, real outcomes, and a measurable impact on how students navigate every other class they take.

---

## How to Use This Guide

Each chapter in this curriculum is designed as a standalone lesson unit. You can teach all 14 units in sequence for a full-year experience, or select individual chapters to target specific student needs at any point in the year.

**For a full-year course:** Follow the lessons in order. The skills are sequenced intentionally — executive functioning comes first because students need organizational infrastructure before they can benefit from social-emotional skill-building.

**For a semester course:** See the Pacing Guide for a compressed 6-week schedule.

**For targeted intervention:** Individual chapters can be pulled and used in advisory, homeroom, or as supplemental lessons in any class. Each chapter stands alone.

**One rule regardless of format:** Always teach the Conclusion lesson last. It is designed as a capstone and celebration, and it loses its impact if taught out of sequence.

---

## What the Teacher's Role Is in This Course

In most courses, the teacher is the content expert delivering knowledge. In this course, the teacher is a facilitator, a model, and a witness to student growth.

**Facilitator:** Your job is to create the conditions for students to discover and apply skills, not to lecture at them about skills. Students learn self-advocacy by practicing self-advocacy — not by hearing about it.

**Model:** You are the most powerful demonstration tool in the room. When you show students your own planner, talk through your own stress management strategies, or walk through the P.I.L.O.T. Framework out loud using a real task, you communicate that these skills are real and that real people use them.

**Witness:** Students in this course will share things that matter to them. Some of it will be uncomfortable. Your ability to receive those disclosures without judgment, without immediately redirecting, and without minimizing is what makes this classroom a place students return to honestly. The content can wait. The student cannot.

---

## What Success Looks Like

At the individual student level, a student who completes this course should be able to:

- Plan a full academic week independently, without an adult managing their schedule for them
- Break any large assignment into a sequenced set of steps and execute them on a timeline they created
- Identify which note-taking method fits how their brain processes information and use it consistently
- Initiate a difficult conversation with a teacher — about a grade, about an extension, about a need — with a clear, respectful ask
- Apply the Scholar Vanguard P.I.L.O.T. Framework to any AI interaction in any school environment, regardless of which AI platform their district uses
- Name their own stress signals before they become crises, and use at least three personal wellness strategies
- Write a reflection that demonstrates genuine insight, not just task completion

At the classroom level, success looks like a room where students are willing to be honest — about what they do not understand, about what is hard, about what they are actually experiencing. That is not a soft outcome. It is the condition under which every other skill in this course gets built.

---

## Common Pitfalls to Avoid

**Pitfall 1: Treating this like a free period.** The moment students believe this class does not matter, the learning stops. Hold high expectations for engagement and reflection. The content is lighter than AP Chemistry. The self-examination required is not.

**Pitfall 2: Skipping the Hook.** Every lesson opens with a Hook for a reason. Students who are not bought into the relevance of the lesson will not engage with the skill. The Hook is not optional warm-up. It is the entry point.

**Pitfall 3: Grading reflection on whether it is "right."** A student who writes "I do not think I have ever been stressed in my life" is not wrong. They are disengaged or not yet safe enough to be honest. The rubric evaluates depth and specificity, not accuracy.

**Pitfall 4: Moving too fast through Chapters 2 and 3.** Time management and project planning are the highest-leverage skills in the course. Students need more than one session to internalize them. Build in review and application across multiple class periods before moving on.

**Pitfall 5: Letting the Exit Ticket get cut.** When time runs short, teachers cut from the end. In this curriculum, the end is where the learning gets consolidated. Protect those 5 minutes. They are the difference between an activity and a lesson.` },

  { id: 'Implementation', label: 'Implementation Tips', desc: 'Classroom management and trauma-informed strategies.', content: `## Week 1 Priorities

**Co-create norms, do not impose them.** Ask students: "What do you need from this class to feel safe enough to be honest?" Write their answers on the board and collectively narrow them to 4-5 class agreements. Post them permanently.

**Establish the no-judgment rule early.** Explicitly tell students: "There are no wrong answers in the reflection space. There are only honest ones." Model vulnerability yourself.

## Trauma-Informed Practices

- **Regulate before you educate.** If a student is visibly dysregulated, connect with them privately before expecting participation. A simple "Are you okay? Do you need a minute?" goes a long way.
- **Never punish dysregulation.** Redirect and reconnect. Separation (sending out of class) should be a last resort, not a first response.
- **Offer choice whenever possible.** "You can share with the class or write it down — your choice." Choice creates safety.
- **Watch for re-traumatization.** Topics like family, finances, and relationships can surface difficult emotions. Always provide an opt-out for sharing.

## Classroom Culture Moves
- Use a weekly anonymous check-in question to take the temperature of the class
- Celebrate effort publicly, celebrate growth privately
- Never compare students to each other
- Normalize not knowing — say "I don't know, let's figure it out" regularly` },

  { id: 'AIToolkit', label: 'AI Literacy Toolkit', desc: 'The P.I.L.O.T. Framework and prompting resources.', content: `## The Scholar Vanguard P.I.L.O.T. Framework™
*Proprietary intellectual property of Scholar Vanguard. All rights reserved.*

The P.I.L.O.T. Framework is a five-step AI implementation process designed to work inside any school AI ecosystem. Whether your students have access to Microsoft Copilot, Google Gemini, ChatGPT, or any future platform, the framework is the same. It teaches students to be the pilot — the decision-maker, the critical thinker, the one in control. AI is the co-pilot. The student is always flying the plane.

This is not a digital citizenship framework. It is not about screen time or whether AI is ethical. It is about teaching students a transferable implementation workflow they will use for the rest of their academic and professional lives.

---

## P.I.L.O.T. Step by Step

| Step | Name | What the Student Does |
| :--- | :--- | :--- |
| **P** | **Purpose** | Define your goal before opening any AI tool. What are you trying to accomplish? What does a successful output look like? Students who skip this step are passengers. |
| **I** | **Input** | Write a precise, detailed prompt. Vague in, vague out. The quality of the AI response is directly proportional to the quality of the prompt. Teach students that prompting is a skill. |
| **L** | **Lift** | Use the AI response as a launching pad, not a landing pad. The first answer is a starting point. Students ask follow-up questions, request examples, push for depth, and challenge surface-level responses. |
| **O** | **Own It** | Verify, fact-check, and critically interrogate what came back. What is accurate? What is missing? What might be biased or oversimplified? Students do not accept AI output at face value. |
| **T** | **Transform** | Rewrite the output in the student's own voice and understanding. If they cannot do this, they have not learned anything. The Transform step is non-negotiable. |

---

## How to Introduce P.I.L.O.T. in the Classroom

1. **Do not start with the framework.** Start with the Shortcut Test (see Ch12 Hook). Students need to feel the problem before they want the solution.
2. **Model each step out loud** using a real task. Walk through all five steps yourself while students watch. Name each step as you do it.
3. **Post the P.I.L.O.T. anchor chart** in the classroom permanently. Every AI task in every subject should reference it.
4. **Require documentation.** Students submit their original prompt, the AI response, their follow-up questions (Lift), their critical notes (Own It), and their final rewritten version (Transform). If the original and final look identical, the last two steps were skipped.

---

## Classroom AI Policy (Co-Create with Students)
Build this together on Day 1 of Chapter 12. Start with these principles and let students add their own:
- AI is a thinking partner, not a ghostwriter
- The P.I.L.O.T. process is required for every AI-assisted assignment
- Submit the AI output AND your transformed final version, always
- If you cannot explain what the AI said in your own words, you are not done
- Using AI to avoid thinking is academic dishonesty. Using AI to think better is a life skill.

---

## P.I.L.O.T.-Ready Prompting Library
These are student-facing starter prompts that model the Input step well:
- "Explain [concept] like I am 14 years old who has never heard of it before. Then give me three examples from real life."
- "I am working on [assignment]. Before you help me, ask me three questions so you understand what I need."
- "Give me 5 practice questions about [topic] at a 9th grade level, then tell me which one is the hardest and why."
- "I wrote this paragraph: [paste paragraph]. What is the weakest part? How can I make it stronger without changing my argument?"
- "What are three counterarguments to this thesis: [thesis]? Which one is the strongest and why?"
- "I am confused about [concept]. Instead of explaining it to me, ask me questions that help me figure it out myself."
- "I used AI to write this. Help me rewrite it in my own voice so it sounds like a 9th grader wrote it, not a robot."

---

## Ethical AI Checklist for Students

Before submitting any AI-assisted work, run through this checklist. Print one copy per student and post the DO column on the classroom wall.

**DO:**
- Use AI to understand a concept you are genuinely struggling with
- Ask AI for practice questions to test your own knowledge before a quiz
- Use AI to get feedback on a paragraph you already wrote yourself
- Ask AI to explain your own notes back to you in simpler terms
- Use AI to generate counterarguments to your thesis so you can strengthen your position
- Ask AI to identify weaknesses in your own argument, then fix them yourself
- Complete the full P.I.L.O.T. documentation for every AI-assisted task

**DO NOT:**
- Submit AI-generated text as your own writing
- Use AI to avoid reading or thinking about the assignment
- Accept the first AI response without pushing back, verifying, or asking follow-up questions
- Use AI during any task marked Level 1: Fully Independent
- Copy and paste AI output directly into any submission
- Use AI to generate personal reflections that are supposed to reflect your actual experience

**The One Test:** If your teacher asked you to explain your work in a 2-minute conversation right now, could you do it fluently? If yes, you are using AI as a tool. If no, AI has replaced your thinking — and that is not a shortcut. It is a setback you will feel on every test, every job, and every moment where you are the only tool in the room.` },

  { id: 'Syllabus', label: 'Detailed Syllabus', desc: 'Printable course structure and objectives.', content: `## Course Information

| | |
| :--- | :--- |
| **Course Name** | 9th Grader's Unofficial Survival Guide |
| **Grade Level** | 9th Grade |
| **Duration** | Full Year |
| **Credits** | Elective (0.5 or 1.0 depending on district) |
| **Prerequisite** | None |

## Course Description
This course explicitly teaches the executive functioning, social-emotional, and AI literacy skills that determine success in high school and beyond. Students will build real systems for managing their time, tackling large projects, communicating effectively, and using technology as a critical thinking tool.

## Materials
- Student planner (physical or digital)
- Dedicated journal or notebook
- Device with internet access (preferred, not required)

## Assessment Philosophy
This course uses **portfolio-based assessment**. Students are evaluated on growth, effort, and authentic reflection — not on whether their answers are "correct." Grades are Pass/Fail or Standards-Based at the teacher's discretion.

## Course Units
1. Introduction: Welcome to High School
2. Chapter 1: Your Brain is Your Superpower
3. Chapter 2: Taming the Calendar
4. Chapter 3: Defeating the Monster Project
5. Chapter 4: Note-Taking for Every Brain
6. Chapter 5: Active Learning and Studying Smart
7. Chapter 6: Communicating with Your Teachers
8. Chapter 7: The Social Scene
9. Chapter 8: Taking Care of Your #1 Asset: You!
10. Chapter 9: Digital Citizenship
11. Chapter 10: How to Read a Syllabus
12. Chapter 11: Intro to Financial Literacy
13. Chapter 12: AI as Your Critical Thinking Co-Pilot
14. Conclusion: You've Got This!

## Academic Integrity and AI Policy

Academic integrity in this course means submitting your own thinking, your own voice, and your own growth. It does not mean avoiding technology. It means using technology as a tool that strengthens your thinking rather than replaces it.

All AI use must follow the Scholar Vanguard P.I.L.O.T. Framework. Students document all five steps and submit that documentation alongside every final product.

### Level 1: Fully Independent Work
No AI use permitted. The goal is to measure what you can produce on your own. Applies to: journal reflections, in-class exit tickets, and any task your teacher designates as independent. These submissions must represent your unassisted thinking.

### Level 2: AI-Assisted with Full Citation
AI may be used as a thinking partner. You must submit: your complete P.I.L.O.T. documentation (all five steps), the AI response you received, and your final transformed version written in your own words. If your final product and the AI output are substantially identical, you have not completed the assignment.

### Level 3: AI as Brainstorming Tool Only
AI may be used to generate ideas or sketch an outline, but all final written work must be drafted independently by you. Include a brief note indicating which tool you used and what specific purpose it served.

**What constitutes a violation:** Submitting AI-generated text as your own work without P.I.L.O.T. documentation. Submitting content you cannot explain in your own words in a follow-up conversation. Using AI to avoid engagement with the material entirely. Consequences align with your school's academic integrity policy.` },

  { id: 'Pacing', label: 'Pacing Guide', desc: '12-week and semester course timelines.', content: `## Full-Year Pacing (50-min sessions, 3x/week)

## Pacing Notes

  { id: 'Rubrics', label: 'Assessment Rubrics', desc: 'Grading frameworks for reflections and portfolios.', content: `## Reflection Rubric (4-Point Scale)

| Score | Descriptor |
| :--- | :--- |
| **4 — Exemplary** | Demonstrates deep personal insight with specific, concrete examples. Connects the skill to their own life clearly and thoughtfully. Writing is coherent and complete. |
| **3 — Proficient** | Shows understanding of the concept with some connection to personal experience. May lack specificity or depth but demonstrates genuine engagement. |
| **2 — Developing** | Surface-level response. Restates the concept without applying it. Minimal personal connection or reflection present. |
| **1 — Beginning** | Off-topic, incomplete, or a single sentence that does not demonstrate engagement with the lesson content. |
| **0 — Not Submitted** | No response submitted. |

## Portfolio Completion Rubric

| Component | Complete | Partial | Missing |
| :--- | :--- | :--- | :--- |
| All lesson reflections submitted | 3 pts | 2 pts | 0 pts |
| At least 8 reflections scored 3 or 4 | 3 pts | 1 pt | 0 pts |
| Evidence of skill application (planner, chunker, habit tracker) | 2 pts | 1 pt | 0 pts |
| Final reflection demonstrates growth over time | 2 pts | 1 pt | 0 pts |

**Total: 10 pts. Pass = 7 or above.**

## Important Note
These rubrics are tools for feedback, not punishment. A student who scores a 1 should receive coaching and a resubmission opportunity. The goal is growth, not a grade.

---

## P.I.L.O.T. Documentation Rubric (Chapter 12)
*For use when assessing AI-assisted assignments using the Scholar Vanguard P.I.L.O.T. Framework.*

| Step | Complete (2 pts) | Partial (1 pt) | Missing (0 pts) |
| :--- | :--- | :--- | :--- |
| **P — Purpose** | Written purpose statement clearly defines the goal and what success looks like before AI was opened. | Purpose is vague or written after the fact. | No purpose statement submitted. |
| **I — Input** | Original prompt is specific, detailed, and contextual. Shows understanding that prompt quality matters. | Prompt is present but generic or one-sentence. | No original prompt submitted. |
| **L — Lift** | At least two meaningful follow-up questions asked of the AI, pushing for depth, examples, or counterarguments. | One follow-up question asked, or follow-ups are surface level. | No follow-up questions documented. |
| **O — Own It** | Student notes identify specific inaccuracies, gaps, or bias in the AI response. Evaluation is critical and specific. | Student noted something about the response but evaluation is vague. | No critical notes on the AI response. |
| **T — Transform** | Final submitted version is clearly written in the student's own voice and meaningfully different from the AI output. | Final version shows minimal changes from AI output. | Final version is identical to AI output. |

**Total: 10 pts. The Transform step carries the same weight as every other step. If the final version matches the AI output, the assignment is incomplete regardless of other steps completed.**

---

## Homework Completion Tracker (Optional)

This course recommends tracking homework not by whether it was completed, but by what the student did with the assignment in the next class session. A student who did the homework and cannot reference it learned less than a student who came back with questions about why they found it hard. Use the following quick check:

| Level | Description |
| :--- | :--- |
| **Applied** | Student brought the work back and referenced it in class or discussion. |
| **Completed** | Student completed the assignment but did not actively use it. |
| **Attempted** | Student started but did not finish. |
| **Not attempted** | No evidence of engagement with the assignment. |

Use this tracker to identify students who may need additional support, not to assign grades. This is diagnostic data, not punitive data.` },

  { id: 'AIIntegration', label: 'AI Integration Strategies', desc: 'Methodologies for implementing AI-assisted assignments across classroom scenarios.', content: `## AI Integration in the Survival Guide Classroom

This guide is for teachers who want to go beyond the P.I.L.O.T. Framework introduction and build AI-integrated assignments into their everyday classroom practice. These strategies work across all chapters — not only Chapter 12.

---

## Scenario 1: Using AI to Scaffold the Writing Process (Any Chapter)

**The Setup:** Students are completing a written reflection. Instead of staring at a blank page, they use AI to get unstuck.

**The P.I.L.O.T. Workflow:**
1. Student writes at least three sentences of their own attempt first. No AI before this.
2. Student pastes their draft into the AI and asks: "What is missing from this reflection? What am I not saying clearly?"
3. Student reads the feedback, then revises their original draft using their own judgment.
4. Student submits their original attempt, the AI feedback, and the revised version — three documents.

**Teacher Note:** The original attempt is the most important document. If it is blank, the student skipped the thinking step. That is the violation, not the AI use.

---

## Scenario 2: AI as a Study Partner for Comprehension Checks

**The Setup:** After teaching a chapter, students quiz themselves using AI.

**The P.I.L.O.T. Workflow:**
1. Student tells the AI: "I just learned about [topic]. Ask me 5 questions about it at a 9th grade level. Do not give me the answers yet."
2. Student answers each question in their own words.
3. Student asks the AI: "Now evaluate my answers. What did I get right? What did I miss or get wrong? Be specific."
4. Student documents what they got wrong and writes a corrected version.

**Why it works:** Retrieval practice is one of the highest-impact study strategies in cognitive science. This method uses AI to make retrieval practice interactive and self-paced.

---

## Scenario 3: AI for Counterargument Generation (Chapters 6, 7, 11, 12)

**The Setup:** Students are developing a position or argument. They use AI to stress-test it before committing.

**The P.I.L.O.T. Workflow:**
1. Student writes their position or thesis in one clear sentence.
2. Student asks AI: "Give me the three strongest counterarguments to this position: [thesis]. Rank them from weakest to strongest and explain why."
3. Student reads the counterarguments and identifies which one they need to address in their final work.
4. Student revises their position or adds a counterargument paragraph that directly addresses the strongest challenge.

**Assessment Note:** A final product that addresses the strongest counterargument shows higher-order thinking than one that ignores it. This strategy raises the floor of student work across the room.

---

## Scenario 4: AI for Vocabulary and Concept Access (All Chapters)

**The Setup:** A student encounters an unfamiliar concept and uses AI to build understanding before asking the teacher.

**The P.I.L.O.T. Workflow:**
1. Student asks: "Explain [concept] three different ways. First, like I am 10 years old. Second, using a real-world example from everyday Detroit life. Third, in the way a textbook would write it."
2. Student reads all three explanations and selects the one that clicks.
3. Student writes a definition in their own words without looking at the AI's response.
4. Student brings the definition to class or to office hours to verify.

**Teacher Note:** This is one of the highest-value use cases for AI in the classroom. Students who would have stayed silent or Googled a shallow answer instead build genuine conceptual understanding.

---

## Grading AI-Integrated Assignments

**What to assess:** The quality of the student's thinking process, not the polish of the final product. An imperfect original attempt plus strong self-correction shows more learning than a polished final with no documentation of the process.

**What to look for in documentation:**
- Did the student make a genuine attempt before using AI?
- Did the student push back on the AI response or accept it passively?
- Is the final product clearly in the student's own voice?
- Can the student explain their work verbally if asked?

**A simple rubric addition:** Add one line to any existing rubric: "AI Use: If AI was used, documentation is complete and final product reflects independent transformation." Worth 1 point out of any scale.` },

  { id: 'Socratic', label: 'Socratic Seminar Guide', desc: 'Frameworks for structured student-led dialogue and critical discussion.', content: `## Socratic Seminar in the Survival Guide Classroom

A Socratic Seminar is a structured, student-led discussion in which participants build understanding collaboratively through questioning rather than debate. In the Survival Guide context, seminars work best after Chapter 7 (Social Skills), Chapter 9 (Digital Citizenship), Chapter 11 (Financial Literacy), and the Conclusion lesson — anywhere students have developed a position and have enough context to defend it with evidence.

---

## Why Seminars Belong in This Course

Most 9th graders have never had a structured conversation where their job was to think out loud, change their mind publicly, and build on someone else's idea instead of winning an argument. That is exactly the skill set that college, careers, and adult civic life require. The Survival Guide teaches skills explicitly — the seminar is where students practice using those skills in a live, unscripted context.

---

## The Inner Circle / Outer Circle Method

This is the recommended format for classes of 20 to 35 students.

**Setup:**
- Arrange chairs in two concentric circles.
- Inner circle (8 to 12 students): These students discuss actively. They may not use notes unless the teacher specifies otherwise.
- Outer circle (remaining students): These students observe and take structured notes on a provided observation form.
- Rotate circles halfway through the seminar time.

**Time:** 40 to 50 minutes total. 15 to 20 minutes per circle rotation. 5 to 10 minutes for debrief.

---

## Seminar Roles and Sentence Starters

Post these on the board and refer to them before the seminar begins.

| Role | What It Looks Like | Sentence Starter |
| :--- | :--- | :--- |
| Questioner | Asks a question that opens the conversation | "What if we considered..." / "What does this mean for..." |
| Builder | Extends what someone else said | "Building on what [name] said..." |
| Evidence-Bringer | Grounds the conversation in something concrete | "The lesson / data / example says..." |
| Devil's Advocate | Introduces the strongest counterargument | "I want to push back on that by saying..." |
| Summarizer | Synthesizes where the group has landed | "So far we seem to agree that... but we are still disagreeing about..." |

Students rotate roles with each rotation of the circles, or the teacher assigns roles before the seminar begins.

---

## Discussion Questions by Chapter

**Chapter 7 — Social Skills and Peer Pressure**
- When does loyalty to a friend become harmful to yourself?
- What is the difference between fitting in and belonging — and which one is worth working for?
- Is it possible to be fully honest with a friend without risking the friendship?

**Chapter 9 — Digital Citizenship**
- Who is responsible for what you post online: you, your parents, your school, or the platform?
- If your digital footprint followed you into every job interview for the rest of your life, what would you change starting today?
- Where is the line between sharing your life and oversharing?

**Chapter 11 — Financial Literacy**
- At what age should a young person be fully financially responsible for themselves?
- Is it possible to build wealth in a city like Detroit without starting with family money?
- What does financial literacy have to do with freedom?

**Chapter 12 — AI Literacy**
- If AI can write a better essay than most high school students, what is the point of students writing essays at all?
- Who is responsible when an AI gives someone harmful advice?
- What should schools do about AI — ban it, embrace it, or something in between?

---

## Observation Form for Outer Circle Students

**Student being observed:** _______________________

Track each time your observed student does one of the following:

| Action | Tally |
| :--- | :--- |
| Made a comment that moved the conversation forward | |
| Asked a genuine question | |
| Built directly on another person's idea | |
| Introduced evidence or a specific example | |
| Changed or qualified their position | |
| Stayed silent for 3 or more consecutive minutes | |

**Most interesting thing your observed student said:** _______________________

**One question you wanted to ask but did not get to:** _______________________

---

## Debrief Protocol (Final 5 to 10 Minutes)

1. "What question did we not get to that deserved more time?"
2. "What was the most surprising thing someone said that changed how you thought about this?"
3. "What do you believe now that you did not believe when we started?"
4. "What would you say differently if we did this again tomorrow?"

Write student responses on the board. These become the seeds for the next written reflection assignment.` },

  {

  label: 'Teacher FAQ & Setup Checklist',
  desc: 'Answers to day-one questions and a step-by-step classroom setup checklist.',
  content: `# Teacher FAQ & Classroom Setup Checklist

## Frequently Asked Questions

**How do students access the app?**
Share the URL: https://scholar-vanguard-hub.netlify.app — students open it in any browser on any device. No download, no account, no login required.

**Is student data stored anywhere other than their own device?**
By default, all data lives in the student's browser (localStorage) and never leaves their device. If you have set up a class code, lesson completions, moods, and journal entries the student chooses to share sync to a private Firebase database connected to your classroom only.

**What devices work?**
Any device with a modern browser. Chrome, Safari, Firefox, and Edge all work. Phone, tablet, Chromebook, and laptop all work. An internet connection is required to load the app. After first load, most features work offline.

**Can students see each other's journals?**
No. Each student's data is stored on their own device. Even with Firebase sync enabled, students can only see their own entries. Only the teacher dashboard can view student data.

**What is the class code and who should have it?**
You generate the class code from the Teacher Hub under Class Setup. Share it with your students verbally or write it on the board on day one. Do not post it publicly online. Students enter it once and it is saved automatically.

**How do I reset a student's progress?**
Have the student open their browser settings, go to Site Data or Storage, and clear data for the app URL. This resets everything on their device. You cannot reset a student remotely.

**What is the teacher password?**
Use the teacher access code provided by Scholar Vanguard. Need one? Email hello@scholarsvanguard.com. Share codes only with co-teachers or instructional coaches, never students.

**What is the P.I.L.O.T. Framework?**
Scholar Vanguard's proprietary five-step AI accountability system. Purpose, Input, Lift, Own It, Transform. It is taught in the AI Literacy lessons (chapters 10 through 12). Introduce it to students before those lessons.

**Do I need to teach the lessons in order?**
No. The lessons are designed to be modular. That said, chapters 1 through 5 (Executive Functioning) build on each other and are best taught in sequence. The Michigan Track lessons are completely standalone.

**What if a student's mood is flagged?**
A red warning badge appears on that student's card in your Class Roster. Click the card to see the date and any note they wrote. Follow your school's standard wellness check-in protocol. The app flags moods rated 1 or 2 out of 5.

---

## Classroom Setup Checklist

### Before Day One
- Open the Teacher Hub and generate your class code under Class Setup
- Write the class code somewhere you can share it quickly (sticky note, slide, or whiteboard)
- Preview the Student Experience from your Teacher Hub so you know what students will see
- Decide how you will introduce the journal (private reflection tool, not graded)
- Test the app on the device type your students will use most

### Day One With Students
- Share the URL: scholar-vanguard-hub.netlify.app
- Walk through the role selection screen together as a class
- Have students enter their name and your class code
- Set a privacy norm out loud: "Your journal stays on your device. I can only see what you choose to share."
- Have every student write their first journal entry before leaving class

### First Week
- Introduce the P.I.L.O.T. Framework before any AI-related lessons
- Assign lesson 1 (Introduction) as the first official lesson
- Check your Class Roster daily to see who has enrolled and completed activities
- Follow up with any student showing a flagged mood (red badge on their card)

### Ongoing
- Review your Daily Brief at the start of each class day
- Use the mood distribution chart to gauge the room before teaching
- Send a Positive Referral email (Template 5) to at least one student per week
- Check homework submission counts and follow up with the Missing Work template (Template 6) as needed
` },

oice\n- **T** — Transform: Produce a final product that reflects you\n\n**Contact**\nFor questions about the Scholar Vanguard curriculum, visit scholarsvanguard.com`

/* ── STUDENT CLASS ENROLLMENT ────────────────────────────────────────── */
const StudentEnrollment = ({ onDone }) => {
  const [classCode, setClassCode] = useLS('sv_class_code', '');
  const [studentName, setStudentName] = useLS('sv_student_name', '');
  // steps: 'enroll' | 'setPin' | 'welcome' | 'return' | 'done'
  const [step, setStep] = useState(classCode ? 'done' : 'enroll');
  const [verifying, setVerifying] = useState(false);
  const [error, setError] = useState('');
  const [teacherName, setTeacherName] = useState('');
  const [pin, setPin] = useState('');
  const [pinConfirm, setPinConfirm] = useState('');
  // For returning student flow
  const [retCode, setRetCode] = useState('');
  const [retName, setRetName] = useState('');
  const [retPin, setRetPin] = useState('');

  // Step 1: verify class code + name, register profile
  const handleJoin = async () => {
    if (!studentName.trim()) { setError('Please enter your name.'); return; }
    const code = classCode.trim().toUpperCase();
    if (!code) { setError('Please enter a class code.'); return; }
    setVerifying(true); setError('');
    if (FB_ENABLED) {
      const info = await fbRead(`sv_classrooms/${code}/info`);
      if (!info) { setError('Class code not found. Check with your teacher.'); setVerifying(false); return; }
      const studentId = getStudentId();
      await fbPatch(`sv_classrooms/${code}/students/${studentId}/profile`, {
        name: studentName.trim(), joinedAt: new Date().toISOString(), lastActive: new Date().toISOString()
      });
      setTeacherName(info.teacherName || '');
    }
    setClassCode(code);
    setVerifying(false);
    if (FB_ENABLED) { setStep('setPin'); } else { setStep('done'); onDone(); }
  };

  // Step 2: save PIN hash
  const handleSetPin = async () => {
    if (!/^\d{4}$/.test(pin)) { setError('PIN must be exactly 4 digits.'); return; }
    if (pin !== pinConfirm) { setError('PINs do not match. Try again.'); return; }
    setVerifying(true); setError('');
    const hash = await hashPin(pin);
    if (hash && FB_ENABLED) {
      const code = getClassCode();
      const sid = getStudentId();
      await fbWrite(`sv_classrooms/${code}/students/${sid}/credentials`, { pinHash: hash });
    }
    setVerifying(false);
    setStep('welcome');
  };

  // Returning student: match by name + PIN, restore studentId
  const handleReturn = async () => {
    const code = retCode.trim().toUpperCase();
    const name = retName.trim();
    if (!code || !name || !/^\d{4}$/.test(retPin)) {
      setError('Enter your class code, first name, and 4-digit PIN.'); return;
    }
    setVerifying(true); setError('');
    const students = await fbRead(`sv_classrooms/${code}/students`);
    if (!students) { setError('Class not found. Check your class code.'); setVerifying(false); return; }
    const hash = await hashPin(retPin);
    const match = Object.entries(students).find(([, s]) => {
      const profileName = (s.profile?.name || '').trim().toLowerCase();
      return profileName === name.toLowerCase() && s.credentials?.pinHash === hash;
    });
    if (!match) { setError('No match found. Check your name and PIN, or ask your teacher.'); setVerifying(false); return; }
    const [foundId] = match;
    // Restore this device to the found student record
    localStorage.setItem('sv_student_id', foundId);
    setClassCode(code);
    setStudentName(match[1].profile?.name || name);
    await fbPatch(`sv_classrooms/${code}/students/${foundId}/profile`, { lastActive: new Date().toISOString() });
    setVerifying(false);
    setStep('done'); onDone();
  };

  const handleSolo = () => { setClassCode('SOLO'); onDone(); };

  if (step === 'done') { onDone(); return null; }

  const wrap = (children) => (
    <div className="min-h-screen flex flex-col items-center justify-center p-6" style={{background:'linear-gradient(135deg,#fff0f5 0%,#f0fafa 100%)'}}>
      <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 w-full max-w-md space-y-6 fade-in">
        {children}
      </div>
    </div>
  );

  if (step === 'welcome') return wrap(<>
    <div className="text-center space-y-2">
      <div className="text-6xl">🎉</div>
      <h2 className="font-black text-gray-900 text-2xl" style={{fontFamily:'Montserrat'}}>You're in!</h2>
      <p className="text-gray-600">
        Welcome, <span className="font-bold text-brand-pink">{studentName.trim()}</span>!
        {teacherName ? <> You joined <span className="font-bold text-brand-teal">{teacherName}'s</span> class.</> : <> Class <span className="font-mono font-bold text-brand-teal">{classCode}</span>.</>}
      </p>
      <p className="text-sm text-gray-500">Your lesson progress, moods, and anything you choose to share will show on your teacher's dashboard.</p>
    </div>
    <button onClick={() => { setStep('done'); onDone(); }} className="w-full bg-brand-teal text-white font-bold py-3 rounded-xl hover:opacity-90 transition">
      Let's Go →
    </button>
  </>);

  if (step === 'setPin') return wrap(<>
    <div className="text-center space-y-1">
      <div className="text-4xl mb-1">🔐</div>
      <h2 className="font-black text-gray-900 text-xl" style={{fontFamily:'Montserrat'}}>Set Your PIN</h2>
      <p className="text-sm text-gray-500">Create a 4-digit PIN so you can sign back in from any device. No email required.</p>
    </div>
    {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">{error}</div>}
    <div className="space-y-3">
      <div>
        <label className="text-xs font-bold text-gray-600 uppercase tracking-wide">4-Digit PIN</label>
        <input type="password" inputMode="numeric" maxLength={4} value={pin} onChange={e=>{ setPin(e.target.value.replace(/\D/g,'')); setError(''); }}
          placeholder="••••" className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl text-sm font-mono tracking-widest text-center text-xl focus:outline-none focus:border-brand-teal"/>
      </div>
      <div>
        <label className="text-xs font-bold text-gray-600 uppercase tracking-wide">Confirm PIN</label>
        <input type="password" inputMode="numeric" maxLength={4} value={pinConfirm} onChange={e=>{ setPinConfirm(e.target.value.replace(/\D/g,'')); setError(''); }}
          placeholder="••••" className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl text-sm font-mono tracking-widest text-center text-xl focus:outline-none focus:border-brand-teal"/>
      </div>
    </div>
    <button onClick={handleSetPin} disabled={verifying} className="w-full bg-brand-teal text-white font-bold py-3 rounded-xl hover:opacity-90 transition disabled:opacity-50">
      {verifying ? 'Saving…' : 'Save PIN & Continue →'}
    </button>
    <button onClick={() => setStep('welcome')} className="w-full text-gray-400 text-sm underline hover:text-gray-600">

const TeacherLogin = ({ onSuccess, onBack }) => {
  const [code, setCode] = useState('');
  const [err, setErr] = useState('');
  const [checking, setChecking] = useState(false);
  const submit = async () => {
    const entered = code.trim().toUpperCase();
    if (!entered) { setErr('Please enter your access code.'); return; }
    setChecking(true);
    const codes = await fbRead('sv_admin/teacherCodes');
    setChecking(false);
    if (!codes || typeof codes !== 'object') {
      setErr('Could not verify your access code right now. Check your connection and try again, or email hello@scholarsvanguard.com.');
      return;
    }
    const ok = !!(codes[entered] && codes[entered].active !== false);
    if (ok) { onSuccess(); }
    else { setErr('Incorrect code. Please try again.'); setCode(''); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#f0fafa 0%,#fff0f5 100%)'}}>
      <div className="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full space-y-6 fade-in">

          <TeacherIcon size={40} cls="text-brand-teal mx-auto mb-3"/>
          <h2 className="section-header">Teacher Access</h2>
          <p className="text-gray-400 text-sm mt-1">Enter your access code to continue.</p>
        </div>
        <div className="space-y-3">
          <input type="password" value={code}
            onChange={e=>{setCode(e.target.value);setErr(false);}}
            onKeyDown={e=>e.key==='Enter'&&submit()}
            placeholder="Access code..."
            className={`w-full p-3 border-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-100 transition ${err?'border-red-400':'border-gray-200 focus:border-brand-teal'}`}

          {err&&<p className="text-xs text-red-500 font-medium">{err}</p>}
          <button onClick={submit} disabled={checking} className="w-full bg-brand-teal text-white py-3 rounded-xl font-bold hover:opacity-90 transition disabled:opacity-60">

const TaskPlanner = () => {
  const [tasks, setTasks] = useLS('tasks', []);
  const [val, setVal] = useState('');
  const [dueDate, setDueDate] = useState('');
  const [priority, setPriority] = useState('');

  const add = () => {
    if (!val.trim()) return;
    setTasks([...tasks, { id: Date.now(), text: val.trim(), done: false, dueDate: dueDate||undefined, priority: priority||undefined }]);
    setVal(''); setDueDate(''); setPriority('');
  };

  const today = new Date(); today.setHours(0,0,0,0);
  const pOrder = {High:0,Medium:1,Low:2};
  const sorted = [...tasks].sort((a,b) => {
    const ad = a.dueDate?new Date(a.dueDate):null, bd = b.dueDate?new Date(b.dueDate):null;
    const ao = ad&&ad<today&&!a.done, bo = bd&&bd<today&&!b.done;
    if (ao&&!bo) return -1; if (!ao&&bo) return 1;
    if (ad&&bd) return ad-bd; if (ad) return -1; if (bd) return 1;
    return (pOrder[a.priority]??3)-(pOrder[b.priority]??3);
  });
  const pbadge = (p) => p==='High'?'text-red-600 bg-red-50 border-red-200':p==='Medium'?'text-yellow-700 bg-yellow-50 border-yellow-200':'text-green-700 bg-green-50 border-green-200';

  return (
    <Card className="max-w-2xl mx-auto">
      <OnboardingBanner storageKey="tasks" title="Your Task Planner keeps all your assignments in one place, sorted by urgency." firstStep="Add your most pressing assignment first. You can set a due date and priority level."/>
      <div className="flex items-center gap-3 mb-6"><CheckCircle size={22} cls="text-brand-pink"/><h2 className="section-header">Weekly Tasks</h2></div>
      <div className="space-y-2 mb-6">
        <div className="flex gap-2">
          <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="What needs to be done?" className="flex-1 p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-200"/>
          <button onClick={add} className="bg-brand-pink text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90">Add</button>
        </div>
        <div className="flex gap-2">
          <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} className="flex-1 p-2 rounded-lg border border-gray-200 text-sm focus:outline-none text-gray-600"/>
          <select value={priority} onChange={e=>setPriority(e.target.value)} className="flex-1 p-2 rounded-lg border border-gray-200 text-sm focus:outline-none text-gray-600">
            <option value="">Priority (optional)</option>
            <option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
      </div>
      <div className="space-y-3">
        {sorted.map(t => {
          const td = t.dueDate?new Date(t.dueDate+'T00:00:00'):null;
          const ov = td&&td<today&&!t.done;
          return (
            <div key={t.id} className={`flex items-center justify-between p-4 rounded-lg group ${ov?'bg-red-50 border border-red-200':'bg-gray-50'}`}>
              <div className="flex items-center gap-3 flex-1 min-w-0">
                <input type="checkbox" checked={t.done} onChange={() => setTasks(tasks.map(x=>x.id===t.id?{...x,done:!x.done}:x))} className="w-5 h-5 flex-shrink-0"/>
                <div className="min-w-0">
                  <span className={`block ${t.done?'line-through text-gray-400':ov?'text-red-700 font-medium':'text-gray-800'}`}>{t.text}</span>
                  <div className="flex items-center gap-2 mt-1 flex-wrap">
                    {t.dueDate&&<span className={`text-xs ${ov?'text-red-500 font-bold':'text-gray-400'}`}>{ov?'⚠ Overdue: ':'Due: '}{new Date(t.dueDate+'T00:00:00').toLocaleDateString()}</span>}
                    {t.priority&&<span className={`text-xs px-2 py-0.5 rounded-full font-semibold border ${pbadge(t.priority)}`}>{t.priority}</span>}
                  </div>
                </div>
              </div>
              <button onClick={() => setTasks(tasks.filter(x=>x.id!==t.id))} className="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition ml-2 flex-shrink-0"><Trash2 size={16}/></button>
            </div>
          );
        })}
        {tasks.length===0&&<p className="text-center text-gray-400 py-6 text-sm">No tasks yet. Add one above!</p>}
      </div>
    </Card>
  );
};

      <OnboardingBanner storageKey="habits" title="The Habit Tracker helps you build routines that support your brain and body." firstStep="Click any day circle to mark a habit complete. Try to fill the whole week!"/>
      <div className="flex items-center justify-between mb-4">
        <h2 className="section-header">Habit Tracker</h2>
        <button onClick={() => setShowReset(true)} className="text-xs text-gray-400 hover:text-red-500 font-semibold no-print">Reset Week</button>

      {showReset&&<div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-center justify-between gap-3">

          <button onClick={() => setShowReset(false)} className="text-xs bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-semibold">Cancel</button>

                  {h.days[i]?'⭐':dayLabels[i].charAt(0)}

            </div>
          );

    </Card>
  );
};

const GradeTracker = () => {
  const [grades, setGrades] = useLS('grades', []);
  const [name, setName] = useState('');
  const [score, setScore] = useState('');
  const [total, setTotal] = useState('');
  const [err, setErr] = useState({});

  const validate = () => {
    const e = {};
    if (!name.trim()) e.name = true;
    if (isNaN(parseFloat(score))||parseFloat(score)<0) e.score = true;
    if (isNaN(parseFloat(total))||parseFloat(total)<=0) e.total = true;
    setErr(e); return Object.keys(e).length===0;
  };

  const add = () => {
    if (!validate()) return;
    const pct = Math.min(100, Math.round((parseFloat(score)/parseFloat(total))*100));
    setGrades([...grades,{id:Date.now(),name:name.trim(),grade:pct}]);
    setName(''); setScore(''); setTotal('');
  };

  const avgGPA = grades.length>0 ? grades.reduce((s,g)=>s+gradeToGPA(g.grade),0)/grades.length : null;
  const gpaColor = avgGPA===null?'':avgGPA>=3.5?'text-green-600':avgGPA>=2.5?'text-yellow-600':'text-red-600';
  const lc = (p) => p>=90?'text-green-600':p>=80?'text-blue-600':p>=70?'text-yellow-600':p>=60?'text-orange-500':'text-red-600';

  return (
    <Card className="max-w-2xl mx-auto">
      <OnboardingBanner storageKey="grades" title="The Grade Tracker shows where you stand in each class using your real scores." firstStep="Add your hardest class first. Enter points earned and total points possible."/>
      <h2 className="section-header mb-1">Grade Tracker</h2>
      <p className="text-sm text-gray-500 mb-4">Enter your score and total points. Letter grades and GPA are calculated automatically.</p>
      {avgGPA!==null&&(
        <div className="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-200">
          <p className="text-xs font-bold uppercase text-gray-400 mb-1" style={{fontFamily:'Montserrat'}}>Estimated GPA (4.0 Scale)</p>
          <p className={`text-4xl font-bold ${gpaColor}`} style={{fontFamily:'Montserrat'}}>{avgGPA.toFixed(2)}</p>
          <p className="text-xs text-gray-400 mt-1">Based on {grades.length} course{grades.length!==1?'s':''} entered</p>
        </div>
      )}
      <div className="space-y-3 mb-5">
        <input value={name} onChange={e=>{setName(e.target.value);setErr(p=>({...p,name:false}))}} placeholder="Class Name (e.g., Algebra 1)"
          className={`w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-200 ${err.name?'border-red-400':'border-gray-200'}`}/>
        {err.name&&<p className="text-xs text-red-500">Please enter a class name.</p>}
        <div className="flex gap-2">
          <div className="flex-1">
            <input type="number" value={score} onChange={e=>{setScore(e.target.value);setErr(p=>({...p,score:false}))}} placeholder="Score (e.g., 87)"
              className={`w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-200 ${err.score?'border-red-400':'border-gray-200'}`}/>
            {err.score&&<p className="text-xs text-red-500 mt-1">Enter a number (0 or more).</p>}
          </div>
          <div className="flex-1">
            <input type="number" value={total} onChange={e=>{setTotal(e.target.value);setErr(p=>({...p,total:false}))}} placeholder="Total (e.g., 100)"
              className={`w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-200 ${err.total?'border-red-400':'border-gray-200'}`}/>
            {err.total&&<p className="text-xs text-red-500 mt-1">Total must be greater than 0.</p>}
          </div>
          <button onClick={add} className="bg-brand-teal text-white px-4 rounded-lg font-semibold hover:opacity-90 self-start py-2.5">Add</button>
        </div>
      </div>
      <div className="space-y-2">
        {grades.map(g => (
          <div key={g.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg group">
            <span className="font-medium text-gray-800">{g.name}</span>
            <div className="flex items-center gap-3">
              <span className="text-sm text-gray-500">{g.grade}%</span>
              <span className={`font-bold text-xl w-8 text-center ${lc(g.grade)}`}>{getLetterGrade(g.grade)}</span>
              <button onClick={() => setGrades(grades.filter(x=>x.id!==g.id))} className="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"><Trash2 size={16}/></button>
            </div>
          </div>
        ))}
        {grades.length===0&&<p className="text-center text-gray-400 py-6 text-sm">No grades yet. Add a class above!</p>}
      </div>
    </Card>
  );
};
